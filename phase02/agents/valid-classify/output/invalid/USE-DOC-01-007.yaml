id: USE-DOC-01-007
dimensions: ["usability"]
dimension: usability
priority: P1
title: "environment 字段能力描述存在而语法参考缺失及平台报错指引"
intent_ref: INTENT-USE-043

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    deploy:
      name: job with environment field
      runs-on: [ubuntu-latest, x64, small]
      environment: production
      steps:
        - name: marker step
          run: |
            echo "deploy"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: error_message
    eval: "deterministic"
    criterion: "平台应拒绝 environment 字段并报 unknown property；记录报错文本供指引质量判定；降级行为归 COMPAT-023"
  - type: negative
    target: documentation
    eval: "deterministic"
    criterion: "using-secrets.md 描述了环境级 Secret 审批能力而语法参考无 environment 条目即不合格"

teardown:
  reset: none
