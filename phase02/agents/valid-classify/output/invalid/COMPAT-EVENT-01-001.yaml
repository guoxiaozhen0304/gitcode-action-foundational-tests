id: COMPAT-EVENT-01-001
dimensions: [compatibility, usability]
dimension: compatibility
priority: P1
title: "GitHub 全量事件集中不受支持事件（release 等）的降级方式"
intent_ref: INTENT-COMPAT-037

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    release:
      types: [published]
  jobs:
    publish:
      name: Probe unsupported release event
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Should never run on unsupported event
          run: |
            echo "RELEASE_JOB_RAN"

trigger:
  event: manual
  as: maintainer
  params:
    probe: "submit workflow with unsupported event release"

fault_injection: null

assertions:
  - type: negative
    target: save_result
    eval: llm_assisted
    rubric: "含 on release 的 workflow 不应被静默保存成功且之后永无触发记录；若保存成功而平台无任何不支持提示，记为缺陷"
  - type: positive
    target: save_result
    eval: llm_assisted
    rubric: "保存或解析阶段应给出明确报错，信息中包含事件不受支持的说明、受支持事件清单（push/pull_request/pull_request_target/issue_comment/pull_request_comment/workflow_dispatch/workflow_call/schedule）及迁移建议"
  - type: nonfunctional
    target: save_result
    eval: llm_assisted
    rubric: "报错应指明这是 GitCode 与 GitHub 的能力差异，而非泛化的 YAML 语法错误"

teardown:
  reset: fixture
