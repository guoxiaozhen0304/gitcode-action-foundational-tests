id: SEC-AUDIT-01-001
dimensions: ["security"]
dimension: security
priority: P1
title: "敏感操作（secret/权限/rerun/审批/评论触发）必须全部留有不可擦除的审计记录"
intent_ref: INTENT-SEC-046
setup:
  repo_fixture: default
workflow: null
trigger:
  event: workflow_dispatch
  as: maintainer
  params:
    ops: [secret_create, secret_update, permission_change, rerun, env_approval, comment_trigger]
fault_injection: null
# 注：本用例为平台操作型——trigger.params.ops 中的敏感操作由 harness 通过平台 API 逐一执行，
# 再通过审计接口对账，无 gitcode workflow，workflow 为 null 属用例设计。
# negative + equals "true" 语义为「不应出现该情况」。
assertions:
  - type: positive
    target: audit_log
    equals: "records_present_all_op_classes"
  - type: negative
    target: sensitive_op_without_trace_detected
    equals: "true"
  - type: negative
    target: operator_audit_delete_accepted
    equals: "true"
  - type: nonfunctional
    target: audit_log
    equals: "retention_and_export_determinable"
teardown:
  reset: fixture
