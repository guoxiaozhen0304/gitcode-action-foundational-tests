id: USE-EXPR-01-003
dimensions: ["usability"]
dimension: usability
priority: P1
title: "expressions 函数表语法标记可解析性与状态关键字术语区分"
intent_ref: INTENT-USE-035

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: null

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: negative
    target: documentation
    eval: "deterministic"
    criterion: "抽取函数表语法列逐行做括号配平与词法检查；hashFiles(paths...)) 等多余括号行存在即不合格"
  - type: negative
    target: documentation
    eval: "deterministic"
    criterion: "字符串扫描确认 success/failed/always/cancelled 是否被列于函数一节且无无括号关键字说明；存在即不合格"

teardown:
  reset: none
