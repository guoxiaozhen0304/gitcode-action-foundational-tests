id: USE-LBL-01-005
dimensions: ["usability"]
dimension: usability
priority: P1
title: "runs-on 含资源池名写法的文档资源池清单 diff"
intent_ref: INTENT-USE-040

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: null

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: negative
    target: documentation
    eval: "deterministic"
    criterion: "样本资源池名集合（dedicate-hosted、codearts-hosted 等）应被文档清单包含；每缺 1 个即一条缺陷"

teardown:
  reset: none
