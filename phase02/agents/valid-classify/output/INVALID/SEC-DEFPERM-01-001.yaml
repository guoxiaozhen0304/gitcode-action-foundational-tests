id: SEC-DEFPERM-01-001
dimensions: ["security"]
dimension: security
priority: P0
title: "ATOMGIT_TOKEN 默认权限范围与 job 级覆盖必须正确生效"
intent_ref: INTENT-SEC-036
setup:
  repo_fixture: default
workflow: |
  on:
    workflow_dispatch:
  permissions:
    repository: read
  jobs:
    inherit-test:
      name: Test permission inheritance
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Attempt write
          run: |
            curl -s -o /dev/null -w "WRITE_%{http_code}" -X POST \
              "https://api.gitcode.com/api/v5/repos/${{ atomgit.repository }}/issues" \
              -H "Authorization: token ${{ atomgit.token }}" \
              -d '{"title": "test"}'
    override-write:
      name: Test job level override to write
      runs-on: [ubuntu-latest, x64, small]
      permissions:
        repository: write
      steps:
        - name: Attempt read after override
          run: |
            curl -s -o /dev/null -w "READ_%{http_code}" -X GET \
              "https://api.gitcode.com/api/v5/repos/${{ atomgit.repository }}" \
              -H "Authorization: token ${{ atomgit.token }}"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
fault_injection: null
assertions:
  - type: negative
    target: run_logs
    must_not_contain: "WRITE_201"
  - type: positive
    target: run_logs
    contains: "WRITE_403"
  - type: positive
    target: run_logs
    contains: "READ_200"
teardown:
  reset: fixture
