id: COMP-RUNNER-01-082
dimensions: [completeness, compatibility]
dimension: completeness
priority: P1
title: flow-mapping 写法 runs-on 的处理结果裁定
intent_ref: INTENT-COMP-029
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  jobs:
    probe:
      name: Probe flow mapping runs-on
      runs-on: {ubuntu-24, x64, small}
      steps:
        - name: Print runner identity
          run: |
            echo "FLOW_MAPPING_RUNNER_RAN"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: nonfunctional
    target: save_validation
    eval: llm_assisted
    rubric: 预期平台校验期报错（对象格式 unknown property，与 VALIDATION-RULES §1 实测一致）；若被特判解析为等价数组则逐字记录调度结果
  - type: negative
    target: runner_mismatch
    eval: llm_assisted
    rubric: 不应语法被接受但调度到非预期 Runner 且无任何提示
teardown:
  reset: none
