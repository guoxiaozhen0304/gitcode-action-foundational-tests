id: COMP-STAGES-01-005
dimensions: [completeness, usability]
dimension: completeness
priority: P1
title: list 形式 stages 的实际处理裁定记录
intent_ref: INTENT-COMP-019
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  stages:
    - name: build-stage
      jobs:
        build:
          name: Stage one job
          runs-on: [ubuntu-latest, x64, small]
          steps:
            - name: Mark stage one
              run: |
                echo "LIST_STAGE_ONE"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: nonfunctional
    target: save_validation
    eval: llm_assisted
    rubric: 预期平台校验期报错（Cannot deserialize Map from Array value，与 VALIDATION-RULES §17 实测一致）；若被接受则逐字记录阶段结构与执行顺序
  - type: negative
    target: run_logs
    eval: llm_assisted
    rubric: 不应出现 stages 被静默忽略、job 丢失串行语义（全部并行）且无任何告警
teardown:
  reset: none
