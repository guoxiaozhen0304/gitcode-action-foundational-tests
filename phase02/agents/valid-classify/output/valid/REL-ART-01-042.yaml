id: REL-ART-01-042
dimensions: [reliability]
dimension: reliability
priority: P2
title: "artifact 大小上限探测——2GB 上传应完整成功（MD5 一致）或上传阶段明确拒绝"
intent_ref: INTENT-REL-078
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
workflow: |
  on:
    workflow_dispatch:
  jobs:
    upload:
      name: upload 2GB artifact job
      runs-on: [ubuntu-latest, x64, large]
      timeout-minutes: 120
      steps:
        - name: generate file step
          run: |
            dd if=/dev/urandom of=big-artifact.bin bs=1M count=2048
            md5sum big-artifact.bin > expected.md5
        - name: upload artifact step
          uses: upload-artifact
          with:
            name: big-artifact-2gb
            path: big-artifact.bin
    download:
      name: download verify job
      runs-on: [ubuntu-latest, x64, large]
      needs: upload
      timeout-minutes: 120
      steps:
        - name: download artifact step
          uses: download-artifact
          with:
            name: big-artifact-2gb
        - name: verify md5 step
          run: |
            md5sum big-artifact-2gb
trigger:
  event: workflow_dispatch
  as: maintainer
  params:
    file_size_gb: 2
    escalation_size_gb: 5
fault_injection: null
assertions:
  - type: positive
    target: upload_outcome
    equals: "success_or_explicit_rejection_with_limit"
  - type: positive
    target: md5_match
    equals: "true_if_upload_success"
  - type: negative
    target: ghost_artifact_detected
    equals: "true"
  - type: nonfunctional
    target: measured_artifact_limit
    equals: "recorded"
teardown:
  reset: fixture
