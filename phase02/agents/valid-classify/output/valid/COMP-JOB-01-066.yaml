id: COMP-JOB-01-066
dimensions: [completeness]
dimension: completeness
priority: P1
title: job 必填字段 name runs-on steps 验证
intent_ref: INTENT-COMP-066
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  jobs:
    verify:
      name: Verify required job fields
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Echo ok
          run: |
            echo "job_fields_ok"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: positive
    target: run_status
    equals: success
  - type: positive
    target: run_logs
    must_contain: job_fields_ok
  - type: negative
    target: workflow_parse
    eval: llm_assisted
    rubric: "变体 V1：提交缺 name 的 job 定义时平台应拒绝，报 jobs[id].name 空值错误，不应静默接受"
  - type: negative
    target: workflow_parse
    eval: llm_assisted
    rubric: "变体 V2：提交缺 steps 的 job 定义时平台应拒绝，提示 steps 为必填，不应静默接受"
teardown:
  reset: fixture
