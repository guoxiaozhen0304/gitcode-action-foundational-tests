id: USE-EXPR-01-004
dimensions: ["usability"]
dimension: usability
priority: P2
title: "未文档化函数 default() 的文档缺失 diff（与平台行为断言合并证据链）"
intent_ref: INTENT-USE-039

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    probe:
      name: probe default function
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: conditional step with default
          if: "${{ default() }}"
          run: |
            echo "default-evaluated-true"
        - name: always marker
          if: ${{ always() }}
          run: |
            echo "job-ran"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_logs
    eval: "deterministic"
    criterion: "记录 default() 求值结果（conditional step 是否执行）；行为语义裁定归 COMP-022，本条按裁决合并为一组双断言用例"
  - type: negative
    target: documentation
    eval: "deterministic"
    criterion: "expressions.md 函数表函数名集合应包含样本实际出现的函数名集合；default 缺失即不合格"

teardown:
  reset: none
