id: REL-LOG-01-041
dimensions: [reliability]
dimension: reliability
priority: P2
title: "单 job 日志大小上限探测——500MB 带序号日志的完整保留或明确截断标识"
intent_ref: INTENT-REL-077
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
workflow: |
  on:
    workflow_dispatch:
  jobs:
    test:
      name: big log probe job
      runs-on: [ubuntu-latest, x64, small]
      timeout-minutes: 120
      steps:
        - name: emit numbered log step
          run: |
            seq -f "LOG_LINE_%08.0f xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" 8000000
trigger:
  event: workflow_dispatch
  as: maintainer
  params:
    target_log_size_mb: 500
    line_numbered: true
fault_injection: null
assertions:
  - type: positive
    target: log_downloadable
    equals: "true"
  - type: positive
    target: tail_integrity
    equals: "complete_or_explicitly_marked_truncated"
  - type: negative
    target: silent_tail_loss_detected
    equals: "true"
  - type: nonfunctional
    target: measured_log_limit
    equals: "recorded"
teardown:
  reset: fixture
