id: USE-ONBD-01-002
dimensions: ["usability"]
dimension: usability
priority: P0
title: "quick-start 示例提交后运行结果可见性检查点"
intent_ref: INTENT-USE-050

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    push:
  jobs:
    hello:
      name: First Pipeline
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Say hello
          run: |
            echo "Hello GitCode Action"

trigger:
  event: push
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_status
    equals: "success"
  - type: positive
    target: run_list
    eval: "deterministic"
    criterion: "push 后运行条目在运行列表可见；可经 API GET 仓库 actions runs 列表端点确定性判定，按 workflow 名过滤断言存在最新条目"

teardown:
  reset: fixture
