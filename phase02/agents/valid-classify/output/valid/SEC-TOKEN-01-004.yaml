id: SEC-TOKEN-01-004
dimensions: ["security"]
dimension: security
priority: P1
title: "残留于 cache/artifact 的 token 在新 run 中绝不应通过鉴权"
intent_ref: INTENT-SEC-037
setup:
  repo_fixture: with-artifacts
workflow: |
  on:
    workflow_dispatch:
  jobs:
    residue-check:
      name: Residual token must not authenticate
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Attempt auth with residual token
          run: |
            if [ -f residual_token.txt ]; then
              RCODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $(cat residual_token.txt)" "https://api.gitcode.com/api/v8/repos/${{ atomgit.repository }}")
              echo "RESIDUAL_TOKEN_HTTP=$RCODE"
              if [ "$RCODE" = "200" ]; then
                echo "RESIDUAL_TOKEN_ACCEPTED_BAD"
                exit 1
              else
                echo "RESIDUAL_TOKEN_REJECTED_OK"
              fi
            else
              echo "RESIDUAL_TOKEN_FIXTURE_MISSING"
            fi
        - name: Confirm current run token works
          run: |
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${{ atomgit.token }}" "https://api.gitcode.com/api/v8/repos/${{ atomgit.repository }}")
            echo "CURRENT_TOKEN_HTTP=$CODE"
            if [ "$CODE" = "200" ]; then
              echo "CURRENT_RUN_TOKEN_OPERATIONAL"
            else
              echo "CURRENT_RUN_TOKEN_FAILED_$CODE"
              exit 1
            fi
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
fault_injection: null
assertions:
  - type: positive
    target: run_logs
    must_contain: "CURRENT_RUN_TOKEN_OPERATIONAL"
  - type: negative
    target: run_logs
    must_not_contain: "RESIDUAL_TOKEN_ACCEPTED_BAD"
  - type: negative
    target: api_response
    must_not_equal: "http_2xx_with_residual_token"
teardown:
  reset: fixture
