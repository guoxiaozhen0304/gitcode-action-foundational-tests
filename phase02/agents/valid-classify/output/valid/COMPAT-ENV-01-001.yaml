id: COMPAT-ENV-01-001
dimensions: [compatibility]
dimension: compatibility
priority: P1
title: ATOMGIT_SHA 环境变量应正确返回触发提交 SHA
intent_ref: INTENT-COMPAT-017

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    test:
      name: Test ATOMGIT_SHA env var
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Verify ATOMGIT_SHA format
          run: |
            echo "atomgit_sha=$ATOMGIT_SHA"
            if echo "$ATOMGIT_SHA" | grep -qE '^[0-9a-f]{40}$'; then
              echo "ATOMGIT_SHA_FORMAT_OK"
            else
              echo "ATOMGIT_SHA_FORMAT_BAD"
              exit 1
            fi

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_status
    equals: success
  - type: positive
    target: run_logs
    must_contain: "ATOMGIT_SHA_FORMAT_OK"
  - type: negative
    target: run_logs
    must_not_contain: "ATOMGIT_SHA_FORMAT_BAD"

teardown:
  reset: fixture
