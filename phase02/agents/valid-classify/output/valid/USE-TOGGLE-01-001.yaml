id: USE-TOGGLE-01-001
dimensions: ["usability", "security"]
dimension: usability
priority: P1
title: "隐藏安全开关 ATOMGIT_ACTIONS_ALLOW_UNSECURE_COMMANDS 默认值与文档缺失"
intent_ref: INTENT-USE-053

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    probe:
      name: hidden toggle probe
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: echo toggle value
          run: |
            echo "allow_unsecure=[${ATOMGIT_ACTIONS_ALLOW_UNSECURE_COMMANDS:-UNSET}]"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_logs
    eval: "deterministic"
    criterion: "记录 ATOMGIT_ACTIONS_ALLOW_UNSECURE_COMMANDS 实际注入值或 UNSET"
  - type: negative
    target: documentation
    eval: "deterministic"
    criterion: "workflow-commands.md 与 using-script-commands.md 未列出该开关名称、默认值与安全影响即不合格；开关实际防护强度由 SEC 维度覆盖"

teardown:
  reset: none
