id: REL-MATRIX-01-041
dimensions: [reliability]
dimension: reliability
priority: P2
title: "matrix 组合数越界——300 组合超上限时应明确报错（含上限值）不得静默截断"
intent_ref: INTENT-REL-076
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
workflow: |
  on:
    workflow_dispatch:
  jobs:
    test:
      name: matrix 300 overflow job
      runs-on: [ubuntu-latest, x64, small]
      strategy:
        matrix:
          os: [os01, os02, os03, os04, os05, os06, os07, os08, os09, os10]
          ver: [v01, v02, v03, v04, v05, v06, v07, v08, v09, v10, v11, v12, v13, v14, v15, v16, v17, v18, v19, v20, v21, v22, v23, v24, v25, v26, v27, v28, v29, v30]
        fail-fast: false
        max-parallel: 5
      steps:
        - name: combo marker step
          run: |
            echo "combo=${{ matrix.os }}-${{ matrix.ver }}"
trigger:
  event: workflow_dispatch
  as: maintainer
  params:
    declared_combinations: 300
fault_injection: null
# 注：negative + equals "true" 语义为「不应出现 silent_truncation_detected=true」，
# 即平台不得在未明确报错（含上限值）的情况下静默截断 300 组合中的部分实例
# （与文本"不应静默截断"一致）。
assertions:
  - type: positive
    target: overflow_outcome
    equals: "expanded_300_or_explicit_rejection_with_limit"
  - type: negative
    target: silent_truncation_detected
    equals: "true"
  - type: nonfunctional
    target: measured_matrix_limit
    equals: "recorded"
teardown:
  reset: none
