id: COMP-PRTARGET-01-003
dimensions: [completeness, security]
dimension: completeness
priority: P1
title: fork PR 按文档推荐配置 pull_request_target 的 secret 暴露面核查
intent_ref: INTENT-COMP-023
setup:
  repo_fixture: fork-pr-target
  secrets: [TEST_SECRET]
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    pull_request_target:
      branches: [main]
  jobs:
    inspect:
      name: Inspect fork pr context
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Checkout pr head
          uses: checkout
          with:
            ref: ${{ atomgit.pull_request.head.sha }}
        - name: Probe secret presence
          env:
            TEST_SECRET: "${{ secrets.TEST_SECRET }}"
          run: |
            if [ -z "$TEST_SECRET" ]; then echo "SECRET_NOT_INJECTED"; else echo "SECRET_INJECTED"; fi
trigger:
  event: pull_request_target
  as: untrusted_contributor
  params: {}
assertions:
  - type: negative
    target: run_logs
    must_not_contain_secret: TEST_SECRET
  - type: negative
    target: secret_injection
    eval: llm_assisted
    rubric: 按 trigger-events.md 推荐配置的 fork PR 不应在无任何平台警示的情况下默认获得仓库 secrets 与写权限；逐字记录 SECRET_INJECTED / SECRET_NOT_INJECTED 实际结果，与 SEC-002/035、COMP-004/014 证据链合并
teardown:
  reset: fixture
