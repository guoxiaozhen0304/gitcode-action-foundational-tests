id: SEC-TOCTOU-01-001
dimensions: ["security"]
dimension: security
priority: P0
title: "审批后推送新 commit 不应被已授权特权运行执行"
intent_ref: INTENT-SEC-031
setup:
  repo_fixture: default
workflow: |
  on:
    workflow_dispatch:
  jobs:
    toctou-test:
      name: Test TOCTOU protection
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Check commit SHA
          run: |
            echo "EXECUTED_SHA=${{ atomgit.sha }}"
trigger:
  event: workflow_dispatch
  as: maintainer
  params:
    approval_flow: "harness 先触发并审批运行，记录审批锁定的 commit SHA；随后在执行前推送新 commit，再观察运行实际执行的 SHA"
fault_injection: null
assertions:
  - type: negative
    target: executed_commit_sha
    must_not_equal: "post_approval_commit_sha"
  - type: positive
    target: executed_commit_sha
    equals: "approved_locked_sha"
    eval: deterministic
teardown:
  reset: fixture
