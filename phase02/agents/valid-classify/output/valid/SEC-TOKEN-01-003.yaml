id: SEC-TOKEN-01-003
dimensions: ["security"]
dimension: security
priority: P1
title: "run 结束后旧 ATOMGIT_TOKEN 调用任何 API 必须失效"
intent_ref: INTENT-SEC-037
setup:
  repo_fixture: default
workflow: |
  on:
    workflow_dispatch:
  jobs:
    token-lifecycle:
      name: Check token validity during run
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Use token for in scope read
          run: |
            git ls-remote https://x-access-token:${{ atomgit.token }}@atomgit.com/${{ atomgit.repository }}.git HEAD
        - name: Emit in run marker
          run: |
            echo "IN_RUN_TOKEN_OPERATIONAL: token worked within scope during run"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
fault_injection: null
assertions:
  - type: positive
    target: run_logs
    equals: "in_run_token_operational"
  - type: negative
    target: api_response
    must_not_equal: "http_2xx_with_post_run_token"
  - type: nonfunctional
    target: rerun_behavior
    equals: "new_token_issued_or_explicit_reuse"
teardown:
  reset: fixture
