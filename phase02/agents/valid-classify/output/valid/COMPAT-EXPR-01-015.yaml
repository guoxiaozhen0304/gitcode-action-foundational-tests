id: COMPAT-EXPR-01-015
dimensions: [compatibility]
dimension: compatibility
priority: P1
title: "startsWith/endsWith 大小写敏感性两侧文档矛盾的差异确认"
intent_ref: INTENT-COMPAT-036

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    probe:
      name: Probe startsWith endsWith case sensitivity
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Evaluate startsWith with mixed case
          run: |
            echo "SW_RESULT=${{ startsWith('Hello World', 'hello') }}"
        - name: Evaluate endsWith with mixed case
          run: |
            echo "EW_RESULT=${{ endsWith('v1.0.rc', '.RC') }}"
        - name: Mark probe complete
          run: |
            echo "PROBE_DONE"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_status
    equals: success
  - type: positive
    target: run_logs
    must_contain: "PROBE_DONE"
  - type: positive
    target: run_logs
    eval: llm_assisted
    rubric: "SW_RESULT 与 EW_RESULT 的值需与 GitCode 文档声明（区分大小写，应均为 false）一致；若实测为 true 则与 GitHub 语义一致但与 GitCode 文档矛盾，应记录为文档缺陷；结论回写 Parity Matrix"

teardown:
  reset: fixture
