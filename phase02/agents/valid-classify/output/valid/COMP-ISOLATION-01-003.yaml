id: COMP-ISOLATION-01-003
dimensions: [completeness, security]
dimension: completeness
priority: P1
title: container.volumes 常规挂载在托管 Runner 的行为记录
intent_ref: INTENT-COMP-025
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  jobs:
    contained:
      name: Run in container with volume
      runs-on: [ubuntu-latest, x64, small]
      container:
        image: ubuntu:22.04
        volumes:
          - /tmp/build-cache:/cache
      steps:
        - name: Probe container env
          run: |
            echo "CONTAINER_PROBE_OK"
            touch /cache/probe_marker && echo "VOLUME_WRITE_OK"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: nonfunctional
    target: container_handling
    eval: llm_assisted
    rubric: 逐字记录 container.image 与 volumes 的处理（正常执行 / 报错信息原文）；COMPAT-NEW-001 已记录 container.image 报错面，本条互补记录 volumes 面，不重复探测
  - type: negative
    target: silent_ignore
    eval: llm_assisted
    rubric: volumes 声明不应被静默忽略（容器内无挂载且无任何提示）
teardown:
  reset: fixture
