id: COMP-STEP-01-069
dimensions: [completeness]
dimension: completeness
priority: P1
title: step 必填与核心字段 name run uses 验证
intent_ref: INTENT-COMP-069
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  jobs:
    verify:
      name: Verify step core fields
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Uses step
          uses: checkout
        - name: Run step
          run: |
            if [ -n "$(ls -A)" ]; then
              echo "run_ok"
            else
              echo "workspace_empty"
              exit 1
            fi
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: positive
    target: run_logs
    must_contain: run_ok
  - type: positive
    target: run_status
    equals: success
teardown:
  reset: fixture
