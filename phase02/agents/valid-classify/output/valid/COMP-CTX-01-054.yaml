id: COMP-CTX-01-054
dimensions: [completeness, compatibility]
dimension: completeness
priority: P1
title: pull_request 触发下 inputs 上下文求值裁定
intent_ref: INTENT-COMP-020
setup:
  repo_fixture: pr-default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    pull_request:
      branches: [main]
  jobs:
    probe:
      name: Probe inputs context
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Echo inputs reference
          run: |
            echo "INPUT_PR_ID=${{ inputs.pr_id }}"
trigger:
  event: pull_request
  as: maintainer
  params: {}
assertions:
  - type: positive
    target: run_logs
    must_contain: INPUT_PR_ID=
  - type: nonfunctional
    target: inputs_eval
    eval: llm_assisted
    rubric: 逐字记录 inputs.pr_id 的求值结果（报错 / 空字符串 / 顶层 inputs 默认值），与 INTENT-COMP-031 顶层 inputs 证据互证
  - type: negative
    target: inputs_determinism
    eval: llm_assisted
    rubric: 同一引用在多次运行间不应给出不一致结果（求值确定性）
teardown:
  reset: fixture
