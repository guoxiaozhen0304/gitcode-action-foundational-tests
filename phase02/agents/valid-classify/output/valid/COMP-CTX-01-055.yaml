id: COMP-CTX-01-055
dimensions: [completeness, compatibility]
dimension: completeness
priority: P1
title: workflow_dispatch 触发下 inputs 正常求值（回归保护）
intent_ref: INTENT-COMP-020
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
      inputs:
        pr_id:
          description: PR id
          default: default-pr
  jobs:
    probe:
      name: Probe dispatch inputs
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Echo dispatch input
          run: |
            echo "DISPATCH_INPUT=${{ inputs.pr_id }}"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: positive
    target: run_status
    equals: success
  - type: positive
    target: run_logs
    must_contain: DISPATCH_INPUT=default-pr
teardown:
  reset: fixture
