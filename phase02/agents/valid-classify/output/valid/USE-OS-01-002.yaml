id: USE-OS-01-002
dimensions: ["usability", "compatibility"]
dimension: usability
priority: P1
title: "runner 上下文返回值精确格式与文档枚举值逐字符一致性"
intent_ref: INTENT-USE-041

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    probe:
      name: runner context value probe
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: echo runner context
          run: |
            echo "os=[${{ runner.os }}]"
            echo "arch=[${{ runner.arch }}]"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_logs
    eval: "deterministic"
    criterion: "完整记录 os 与 arch 实际返回字符串；按门禁裁决复用 COMPAT-018/019 实测值，不重复探测"
  - type: negative
    target: documentation
    eval: "deterministic"
    criterion: "实际返回值与 context.md 枚举值（Linux、X64）逐字符 diff；存在大小写或命名风格差异且文档未说明比较规则即不合格"

teardown:
  reset: none
