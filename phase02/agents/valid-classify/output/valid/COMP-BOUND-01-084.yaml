id: COMP-BOUND-01-084
dimensions: [completeness]
dimension: completeness
priority: P1
title: 路径与分支过滤组合及否定模式边界验证
intent_ref: INTENT-COMP-084
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    push:
      branches:
        - main
        - "feature/**"
        - "!feature/experimental"
      paths:
        - "src/**"
        - "!src/docs/**"
  jobs:
    verify:
      name: Verify filter boundary
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Print trigger context
          run: |
            echo "TRIGGER_REF=${{ atomgit.ref }}"
            echo "filter_boundary_ok"
trigger:
  event: push
  as: maintainer
  params: {}
assertions:
  - type: positive
    target: run_status
    equals: success
  - type: positive
    target: run_logs
    must_contain: TRIGGER_REF=refs/
  - type: negative
    target: run_logs
    eval: llm_assisted
    rubric: "排除侧观测：推送到被否定模式排除的分支 feature/experimental，或仅修改被排除路径 src/docs/** 时，不应产生本 workflow 的新运行记录"
teardown:
  reset: fixture
