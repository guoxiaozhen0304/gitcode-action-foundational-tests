id: REL-TIMEOUT-01-011
dimensions: [reliability]
dimension: reliability
priority: P2
title: "自定义 timeout 超默认值——timeout-minutes=720 的接受/拒绝语义探测"
intent_ref: INTENT-REL-075
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
workflow: |
  on:
    workflow_dispatch:
  jobs:
    probe:
      name: timeout 720 probe job
      runs-on: [ubuntu-latest, x64, small]
      timeout-minutes: 720
      steps:
        - name: timeout probe step
          run: |
            echo "timeout_720_probe_marker"
trigger:
  event: workflow_dispatch
  as: maintainer
  params:
    probe_target_minutes: 370
    scaled_probe_allowed: true
fault_injection: null
assertions:
  - type: positive
    target: config_outcome
    equals: "accepted_or_explicitly_rejected"
  - type: negative
    target: silent_truncation_to_360_detected
    equals: "true"
  - type: nonfunctional
    target: rejection_error_contains_limit
    equals: "true_if_rejected"
teardown:
  reset: none
