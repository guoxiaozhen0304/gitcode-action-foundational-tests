id: COMPAT-ACTIONDEV-01-002
dimensions: [compatibility]
dimension: compatibility
priority: P1
title: "action 运行时 runs.using 类型覆盖（node16/composite/docker/node20）探测"
intent_ref: INTENT-COMPAT-048

setup:
  repo_fixture: with-local-actions
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    probe:
      name: Probe runs using runtime coverage
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Invoke local node16 action
          uses: ./.gitcode/actions/probe-node16
        - name: Invoke local composite action
          uses: ./.gitcode/actions/probe-composite
        - name: Invoke local docker action
          uses: ./.gitcode/actions/probe-docker
        - name: Invoke local node20 action
          uses: ./.gitcode/actions/probe-node20
        - name: Mark probe complete
          run: |
            echo "USING_PROBE_DONE"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_logs
    eval: llm_assisted
    rubric: "node16 本地 action 应正常执行；composite/docker/node20 各自得到确定响应（执行成功或 action 加载期明确报错并给出替代指引）；据此确定 GitCode 支持的 runs.using 取值全集"
  - type: negative
    target: run_logs
    eval: llm_assisted
    rubric: "不支持的 using 类型不应表现为运行期模糊失败（如 node command not found 之类与加载无关的含混报错）"
  - type: nonfunctional
    target: run_logs
    eval: llm_assisted
    rubric: "支持的运行时清单写入差异文档；composite 不支持时须显式声明 GitHub 生态复用逻辑的替代机制"

teardown:
  reset: fixture
