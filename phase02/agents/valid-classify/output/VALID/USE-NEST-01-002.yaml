id: USE-NEST-01-002
dimensions: ["usability"]
dimension: usability
priority: P1
title: "workflow_call 嵌套 2 层时应正常执行"
intent_ref: INTENT-USE-026

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
  reusable_workflows:
    .gitcode/workflows/reusable-level1.yml: |
      on:
        workflow_call:
      jobs:
        level1:
          name: level1 reusable
          uses: ./.gitcode/workflows/reusable-level2.yml
    .gitcode/workflows/reusable-level2.yml: |
      on:
        workflow_call:
      jobs:
        level2:
          name: level2 reusable
          runs-on: [ubuntu-latest, x64, small]
          steps:
            - name: echo level2
              run: |
                echo "level2 executed"

workflow: |
  on:
    workflow_dispatch:
  jobs:
    caller:
      name: second level nested call
      uses: ./.gitcode/workflows/reusable-level1.yml

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_status
    equals: COMPLETED
  - type: positive
    target: run_logs
    contains: "level2 executed"

teardown:
  reset: none
