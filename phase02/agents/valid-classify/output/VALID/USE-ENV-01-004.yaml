id: USE-ENV-01-004
dimensions: ["usability", "compatibility"]
dimension: usability
priority: P0
title: "job env 在 shell 层与表达式层取值一致性（文档承诺兑现验证）"
intent_ref: INTENT-USE-046

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    env-probe:
      name: job env injection probe
      runs-on: [ubuntu-latest, x64, small]
      env:
        APP_ENV: prod
      steps:
        - name: read env both layers
          run: |
            echo "shell=[$APP_ENV]"
            echo "expr=[${{ env.APP_ENV }}]"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_logs
    contains: "expr=[prod]"
  - type: positive
    target: run_logs
    contains: "shell=[prod]"
  - type: negative
    target: documentation
    eval: "deterministic"
    criterion: "若 shell 层实际为空则文档对该 job 内所有 step 可见的表述与平台行为矛盾，记文档承诺未兑现缺陷；行为修复归 COMPAT-017 联动"

teardown:
  reset: none
