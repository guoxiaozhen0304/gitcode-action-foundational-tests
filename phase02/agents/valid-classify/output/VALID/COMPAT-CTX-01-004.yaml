id: COMPAT-CTX-01-004
dimensions: [compatibility]
dimension: compatibility
priority: P1
title: "atomgit.actor 规格自相矛盾的实测仲裁"
intent_ref: INTENT-COMPAT-040

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    probe:
      name: Probe atomgit actor field
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Echo atomgit actor value
          run: |
            echo "ACTOR_VALUE=${{ atomgit.actor }}"
            echo "PROBE_DONE"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_logs
    must_contain: "PROBE_DONE"
  - type: positive
    target: run_logs
    eval: llm_assisted
    rubric: "ACTOR_VALUE 应为触发者用户名（与官方示例文档一致）；若求值为空或解析报错，则记录与文档示例的矛盾并列入缺失字段清单"
  - type: negative
    target: run_logs
    eval: llm_assisted
    rubric: "不应出现 context.md 未列出而示例文档使用、实测行为与两者都不符且无记录的三方不一致"

teardown:
  reset: fixture
