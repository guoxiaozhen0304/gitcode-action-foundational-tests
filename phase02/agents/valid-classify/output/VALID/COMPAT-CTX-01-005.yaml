id: COMPAT-CTX-01-005
dimensions: [compatibility]
dimension: compatibility
priority: P1
title: "atomgit 缺位字段（job/run_attempt/triggering_actor/ref_protected）求值行为探测"
intent_ref: INTENT-COMPAT-040

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    probe:
      name: Probe missing atomgit fields
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Echo job and run attempt fields
          run: |
            echo "CTX_JOB=${{ atomgit.job }}"
            echo "CTX_RUN_ATTEMPT=${{ atomgit.run_attempt }}"
        - name: Echo actor related fields
          run: |
            echo "CTX_TRIGGERING_ACTOR=${{ atomgit.triggering_actor }}"
            echo "CTX_REF_PROTECTED=${{ atomgit.ref_protected }}"
        - name: Compare with env side
          run: |
            echo "ENV_RUN_ATTEMPT=$ATOMGIT_RUN_ATTEMPT"
            echo "PROBE_DONE"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_logs
    must_contain: "PROBE_DONE"
  - type: positive
    target: run_logs
    eval: llm_assisted
    rubric: "逐字段记录 CTX_JOB/CTX_RUN_ATTEMPT/CTX_TRIGGERING_ACTOR/CTX_REF_PROTECTED 的求值行为（有值/空/解析报错）；与 ENV_RUN_ATTEMPT 对照确认上下文侧缺位是否有环境变量替代；缺失清单进迁移对照文档"

teardown:
  reset: fixture
