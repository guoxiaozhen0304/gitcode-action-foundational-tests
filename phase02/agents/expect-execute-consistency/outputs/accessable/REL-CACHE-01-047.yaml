id: REL-CACHE-01-047
dimensions: [reliability]
dimension: reliability
priority: P2
title: "cache 容量上限探测——500MB/1GB/2GB 单 cache 的接受/拒绝语义"
intent_ref: INTENT-REL-079
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
workflow: |
  on:
    workflow_dispatch:
  jobs:
    test:
      name: cache size probe job
      runs-on: [ubuntu-latest, x64, large]
      strategy:
        matrix:
          size_mb: [500, 1000, 2000]
        fail-fast: false
      steps:
        - name: cache save step
          uses: cache
          with:
            path: cache_data
            key: cache-size-probe-${{ matrix.size_mb }}
        - name: generate cache data step
          run: |
            mkdir -p cache_data
            dd if=/dev/urandom of=cache_data/data.bin bs=1M count=${{ matrix.size_mb }}
trigger:
  event: workflow_dispatch
  as: maintainer
  params:
    size_tiers_mb: [500, 1000, 2000]
    readback_verify: true
fault_injection: null
assertions:
  - type: positive
    target: write_outcome
    equals: "accepted_or_explicit_rejection_with_limit"
  - type: positive
    target: readback_md5_match
    equals: "true_if_accepted"
  - type: negative
    target: silent_corruption_detected
    equals: "true"
  - type: nonfunctional
    target: measured_cache_limit
    equals: "recorded"
teardown:
  reset: fixture
