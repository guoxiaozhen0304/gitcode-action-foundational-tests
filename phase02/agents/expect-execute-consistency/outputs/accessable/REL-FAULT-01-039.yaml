id: REL-FAULT-01-039
dimensions: [reliability]
dimension: reliability
priority: P1
title: "故障注入——排队期唯一匹配 runner 下线，job 应重调度或有界等待后明确失败"
intent_ref: INTENT-REL-082
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
workflow: |
  on:
    workflow_dispatch:
  jobs:
    test:
      name: queued runner offline probe job
      runs-on: [self-hosted, arch=x64, group=006]
      timeout-minutes: 30
      steps:
        - name: probe step
          run: |
            echo "rescheduled_or_recovered_marker"
trigger:
  event: workflow_dispatch
  as: maintainer
  params:
    observe_window_minutes: 10
    runner_rejoin_after_observe: true
fault_injection:
  at: pre_job
  action: kill_runner
  params:
    phase: queued
    target: only_matching_runner
    method: stop_agent_process
  recovery_expectation: "reschedule_or_bounded_explicit_failure; pool_recovers_after_runner_rejoin"
assertions:
  - type: nonfunctional
    target: queued_escape_seconds
    le: "600"
  - type: negative
    target: queued_stall_beyond_window_detected
    equals: "true"
  - type: positive
    target: post_recovery_new_job_scheduled
    equals: "true"
teardown:
  reset: full_instance
