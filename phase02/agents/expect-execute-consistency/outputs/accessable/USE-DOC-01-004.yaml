id: USE-DOC-01-004
dimensions: ["usability"]
dimension: usability
priority: P0
title: "workflow-commands 多行输出示例漏写重定向照抄得空输出"
intent_ref: INTENT-USE-033

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    probe:
      name: multiline output doc example
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: doc example produce output
          id: producer
          run: |
            echo "multiline<<EOF"
            echo "line1"
            echo "line2"
            echo "EOF"
        - name: read output
          run: |
            echo "got=[${{ steps.producer.outputs.multiline }}]"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_logs
    eval: "deterministic"
    criterion: "日志中 got= 后为空（got=[]）即实证文档示例漏写重定向；若实际有值则示例可复刻，本断言按实际结果记录"
  - type: negative
    target: documentation
    eval: "deterministic"
    criterion: "workflow-commands.md 多行输出示例缺少写入 ATOMGIT_OUTPUT 的重定向行且未标注省略即为不合格"

teardown:
  reset: none
