id: USE-ONBD-01-001
dimensions: ["usability"]
dimension: usability
priority: P0
title: "新手快速开始路径端到端可复刻走查（判定方式：llm_assisted）"
intent_ref: INTENT-USE-050

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: null

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: nonfunctional
    target: documentation
    eval: "llm_assisted"
    rubric: "由无 GitCode 经验的评测者或 LLM 模拟新手按 00-overview 与 01-quick-start 逐步操作，记录每个卡壳点（找不到开通入口、不知道仓库要有内容、不知道 push 后去哪看结果）；卡壳点数量应为 0，全流程应不超过 30 分钟；新手是否会卡需主观评判"
  - type: negative
    target: documentation
    eval: "deterministic"
    criterion: "quick-start 前提清单未包含 Action 功能开通步骤且正文未给出开启入口即为隐式前提缺陷"

teardown:
  reset: none
