id: REL-CLUSTER-01-001
dimensions: [reliability]
dimension: reliability
priority: P1
title: "集群断连恢复后断连窗口任务日志同步"
intent_ref: INTENT-REL-091
setup:
  repo_fixture: default
  secrets: []
  variables:
    long_running_task: "true"
    log_collection_cycle_known: "true"
  branch_protection: default
workflow: null
trigger:
  event: manual
  as: maintainer
  params:
    platform_op: cluster_disconnect_reconnect
fault_injection:
  at: mid_job
  action: network_partition
  params:
    disconnect_duration: ">=1 个日志采集周期"
  recovery_expectation: "恢复连接后断连窗口日志同步追平，或日志明确标注缺失区间"
assertions:
  - type: positive
    target: log_sync_after_reconnect
    eval: llm_assisted
    rubric: "恢复连接后，断连期间的任务日志应完整返回或明确标注缺失区间。输入退化声明：oracle 仅有 xlsx 预期结果列（能正常返回日志，实测未执行），完整性细项无平台侧文档支撑，需结合实测环境判定"
  - type: negative
    target: log_sync_after_reconnect
    eval: llm_assisted
    rubric: "不应出现断连窗口日志静默丢失且无任何提示"
teardown:
  reset: fixture
