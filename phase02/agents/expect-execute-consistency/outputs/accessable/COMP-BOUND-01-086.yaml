id: COMP-BOUND-01-086
dimensions: [completeness]
dimension: completeness
priority: P1
title: 矩阵构建 include exclude 与单值边界验证
intent_ref: INTENT-COMP-086
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  jobs:
    verify:
      name: Verify matrix boundary
      runs-on: [ubuntu-latest, x64, small]
      strategy:
        matrix:
          os: [linux]
          version: [1, 2]
          include:
            - os: linux
              version: 3
          exclude:
            - os: linux
              version: 2
      steps:
        - name: Matrix value
          run: |
            echo "INSTANCE=${{ matrix.os }}-${{ matrix.version }}"
            echo "matrix_ok"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: positive
    target: run_logs
    must_contain: matrix_ok
  - type: positive
    target: run_logs
    must_contain: INSTANCE=linux-1
  - type: positive
    target: run_logs
    must_contain: INSTANCE=linux-3
  - type: negative
    target: run_logs
    must_not_contain: INSTANCE=linux-2
  - type: positive
    target: job_instance_count
    equals: 2
teardown:
  reset: fixture
