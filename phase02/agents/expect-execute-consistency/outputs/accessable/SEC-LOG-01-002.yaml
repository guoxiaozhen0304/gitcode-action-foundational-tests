id: SEC-LOG-01-002
dimensions: ["security"]
dimension: security
priority: P1
title: "导出/历史日志副本中 secret 原值命中数必须为 0，遮蔽状态不可回退"
intent_ref: INTENT-SEC-040
setup:
  repo_fixture: with-secrets
  secrets: ["DEPLOY_TOKEN"]
workflow: |
  on:
    workflow_dispatch:
  jobs:
    masked-log-producer:
      name: Produce masked secret log
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Reference secret in log
          run: |
            echo "MASKED_SECRET_LINE: ${{ secrets.DEPLOY_TOKEN }}"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
fault_injection: null
assertions:
  - type: positive
    target: log_api
    equals: "download_ok"
  - type: negative
    target: exported_logs
    must_not_contain_secret: "DEPLOY_TOKEN"
  - type: negative
    target: historical_logs
    must_not_contain_secret: "DEPLOY_TOKEN"
  - type: negative
    target: mask_regression_detected
    equals: "true"
teardown:
  reset: fixture
