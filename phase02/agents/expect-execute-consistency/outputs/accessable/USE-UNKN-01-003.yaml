id: USE-UNKN-01-003
dimensions: ["usability", "compatibility"]
dimension: usability
priority: P1
title: "step 标识 id 与 identifier 命名双轨的接受一致性与文档说明"
intent_ref: INTENT-USE-036

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    with-id:
      name: step using document field name
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: produce value
          id: producer
          run: |
            echo "result=ok" >> $ATOMGIT_OUTPUT
        - name: consume value
          run: |
            echo "via-id=[${{ steps.producer.outputs.result }}]"
    with-identifier:
      name: step using sample field name
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: produce value alt
          identifier: producer
          run: |
            echo "result=ok" >> $ATOMGIT_OUTPUT

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: validation_result
    eval: "deterministic"
    criterion: "分别记录 id 写法与 identifier 写法的平台接受情况与求值行为；两者不一致且文档无说明即记缺陷"
  - type: negative
    target: documentation
    eval: "deterministic"
    criterion: "对文档字段集合与样本字段集合做 diff；identifier 不在文档字段集合内且文档未在任何一处提及即不合格"

teardown:
  reset: none
