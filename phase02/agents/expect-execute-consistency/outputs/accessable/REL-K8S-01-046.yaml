id: REL-K8S-01-046
dimensions: [reliability]
dimension: reliability
priority: P1
title: "K8s 单集群接入与 NPU 资源发现正确性"
intent_ref: INTENT-REL-086
setup:
  repo_fixture: default
  secrets: []
  variables:
    member_clusters: "1"
    npu_node_required: "true"
  branch_protection: default
workflow: null
trigger:
  event: manual
  as: maintainer
  params:
    platform_op: cluster_onboarding
fault_injection: null
assertions:
  - type: positive
    target: cluster_onboarding_status
    equals: "success"
  - type: positive
    target: npu_resource_view
    eval: llm_assisted
    rubric: "平台资源视图中该集群的 NPU 型号与可分配数量应与 kubectl describe node 实测物理拓扑一致。输入退化声明：oracle 仅有 xlsx 预期结果列（接入成功），资源一致性细项无平台侧文档支撑，需结合实测环境判定"
  - type: negative
    target: npu_resource_view
    eval: llm_assisted
    rubric: "不应出现接入成功但 NPU 资源发现为空或发现错误的假阳性"
teardown:
  reset: fixture
