id: SEC-TOCTOU-01-003
dimensions: ["security"]
dimension: security
priority: P1
title: "评论触发后被编辑的内容绝不应改变已排队/运行中 workflow 读取的事件负载"
intent_ref: INTENT-SEC-043
setup:
  repo_fixture: default
workflow: |
  on:
    pull_request_comment:
      types: [created, edited]
  jobs:
    snapshot-check:
      name: Comment snapshot consistency check
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Snapshot trigger time comment hash
          run: |
            echo "COMMENT_SNAPSHOT: capturing trigger time comment content hash"
        - name: Window for edit race
          run: |
            sleep 60
            echo "POST_EDIT_READ: re checking comment content consistency"
trigger:
  event: pull_request_comment
  as: untrusted_contributor
  params:
    edit_during_run: true
fault_injection: null
assertions:
  - type: positive
    target: run_logs
    equals: "trigger_time_snapshot_consistent"
  - type: negative
    target: run_logs
    must_not_contain: "edited_content_adopted"
  - type: nonfunctional
    target: trigger_audit
    equals: "audit_comment_matches_trigger_time"
teardown:
  reset: fixture
