id: REL-K8S-01-050
dimensions: [reliability]
dimension: reliability
priority: P1
title: "【回归】pod 多副本任务（Worker）指定 NPU 调度——当前已知不通过，修复后回归"
intent_ref: INTENT-REL-088
setup:
  repo_fixture: default
  secrets: []
  variables:
    worker_replicas: ">=2"
    known_failure: "xlsx 实测不通过，断言按修复后的正确行为编写，修复前预期失败"
  branch_protection: default
workflow: null
trigger:
  event: manual
  as: maintainer
  params:
    platform_op: pod_multi_replica_npu_scheduling
fault_injection: null
assertions:
  - type: positive
    target: multi_replica_worker_pod_status
    equals: "Running"
  - type: positive
    target: per_replica_npu_allocation
    eval: llm_assisted
    rubric: "每个 Worker 副本均应获得所指定的 NPU 资源（型号+数量）。输入退化声明：oracle 仅有 xlsx 预期结果列（能正常运行，实测不通过），逐副本分配细项需结合实测环境判定"
  - type: negative
    target: per_replica_npu_allocation
    eval: llm_assisted
    rubric: "不应出现部分副本未获得 NPU、副本间资源争抢或静默降级为无卡运行"
teardown:
  reset: fixture
