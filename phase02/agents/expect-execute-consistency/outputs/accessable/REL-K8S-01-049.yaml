id: REL-K8S-01-049
dimensions: [reliability]
dimension: reliability
priority: P1
title: "pod NPU 单卡/多卡调度正确性与非法请求 Pending 语义"
intent_ref: INTENT-REL-088
setup:
  repo_fixture: default
  secrets: []
  variables:
    npu_models_known: "true"
    single_node_card_limit_known: "true"
  branch_protection: default
workflow: null
trigger:
  event: manual
  as: maintainer
  params:
    platform_op: pod_npu_scheduling
fault_injection: null
assertions:
  - type: positive
    target: single_card_pod_status
    equals: "Running"
  - type: positive
    target: multi_card_pod_status
    equals: "Running"
  - type: positive
    target: invalid_model_pod_status
    equals: "Pending"
  - type: positive
    target: over_limit_pod_status
    equals: "Pending"
  - type: negative
    target: pod_npu_placement
    eval: llm_assisted
    rubric: "请求不存在的型号不应被错误调度到替代型号；超单节点物理上限的数量不应被拆分跨节点静默分配。输入退化声明：oracle 仅有 xlsx 预期结果列（Pod 处于 Pending 状态），分配路径细项无平台侧文档支撑，需结合实测环境判定"
teardown:
  reset: fixture
