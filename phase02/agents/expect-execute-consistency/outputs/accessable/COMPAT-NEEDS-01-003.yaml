id: COMPAT-NEEDS-01-003
dimensions: [compatibility]
dimension: compatibility
priority: P1
title: "matrix 上游 job 的 needs outputs 聚合语义与未声明 output 边界"
intent_ref: INTENT-COMPAT-041

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    gen:
      name: Matrix upstream producing outputs
      runs-on: [ubuntu-latest, x64, small]
      strategy:
        matrix:
          idx: [1, 2]
      outputs:
        mark: ${{ steps.emit.outputs.mark }}
      steps:
        - name: Emit per instance mark
          id: emit
          run: |
            echo "mark=instance-${{ matrix.idx }}" >> "$ATOMGIT_OUTPUT"
    consume:
      name: Consume matrix aggregated output
      needs: gen
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Read aggregated and undeclared outputs
          run: |
            echo "AGG_MARK=${{ needs.gen.outputs.mark }}"
            echo "UNDECLARED=${{ needs.gen.outputs.never_declared }}"
            echo "PROBE_DONE"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_logs
    must_contain: "PROBE_DONE"
  - type: positive
    target: run_logs
    eval: llm_assisted
    rubric: "AGG_MARK 取值应确定可复现（重复运行一致）；与 GitHub 取最后完成实例的语义对齐或差异文档化；多次运行取值随机记为缺陷"
  - type: positive
    target: run_logs
    eval: llm_assisted
    rubric: "UNDECLARED 应为空值而非解析报错（INTENT-COMPAT-NEW-006 边界在本场景复验，证据并入）"

teardown:
  reset: fixture
