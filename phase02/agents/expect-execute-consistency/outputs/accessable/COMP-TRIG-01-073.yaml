id: COMP-TRIG-01-073
dimensions: [completeness]
dimension: completeness
priority: P1
title: pull_request 事件关键字段与 types 验证
intent_ref: INTENT-COMP-073
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    pull_request:
      types: [open, update, reopen]
      branches: [main]
  jobs:
    verify:
      name: Verify pull_request event fields
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Print PR fields
          run: |
            echo "PR_NUM=${{ atomgit.event.pull_request.number }}"
            echo "PR_TITLE=${{ atomgit.event.pull_request.title }}"
            echo "PR_STATE=${{ atomgit.event.pull_request.state }}"
            echo "pr_ok"
        - name: Check action in types whitelist
          run: |
            ACTION="${{ atomgit.event.action }}"
            echo "PR_ACTION=$ACTION"
            case "$ACTION" in
              open|update|reopen) echo "type_in_filter" ;;
              *) echo "type_out_of_filter" ;;
            esac
trigger:
  event: pull_request
  as: maintainer
  params: {}
assertions:
  - type: positive
    target: run_logs
    must_contain: PR_NUM=
  - type: positive
    target: run_logs
    must_contain: pr_ok
  - type: positive
    target: run_logs
    must_contain: type_in_filter
  - type: negative
    target: run_logs
    must_not_contain: type_out_of_filter
teardown:
  reset: fixture
