id: USE-VARS-01-002
dimensions: ["usability", "compatibility"]
dimension: usability
priority: P1
title: "变量插值双语法与 atomgit 属性名的文档清单 diff 及求值探测"
intent_ref: INTENT-USE-038

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    interp:
      name: legacy interpolation probe
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: legacy dollar brace vars
          run: |
            echo "legacy1=[${gitcode_SOURCE_BRANCH}]"
            echo "legacy2=[${PIPELINE_RUN_ID}]"
            echo "std=[${{ atomgit.repository }}]"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_logs
    eval: "deterministic"
    criterion: "检查日志中 legacy1/legacy2 是否被求值（原样输出或为空即为未求值），记录结果供文档一致性判定"
  - type: negative
    target: documentation
    eval: "deterministic"
    criterion: "样本插值语法与属性名集合（含 atomgit.repositoryurl）与文档清单 diff；样本出现而文档未列的数量应为 0；行为裁定归 COMP-032"

teardown:
  reset: none
