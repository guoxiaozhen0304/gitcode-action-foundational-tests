id: SEC-SECMGMT-01-001
dimensions: ["security"]
dimension: security
priority: P1
title: "Secret 写入后任何 API/UI 路径绝不应回读明文"
intent_ref: INTENT-SEC-038
setup:
  repo_fixture: with-secrets
  secrets: ["DEPLOY_TOKEN"]
workflow: |
  on:
    workflow_dispatch:
  jobs:
    secret-reference:
      name: Reference secret normally
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Reference secret in workflow
          run: |
            echo "SECRET_REFERENCE_CHECK: ${{ secrets.DEPLOY_TOKEN }}"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
fault_injection: null
assertions:
  - type: positive
    target: run_logs
    equals: "masked_with_asterisks"
  - type: negative
    target: secret_mgmt_api
    must_not_contain_secret: "DEPLOY_TOKEN"
teardown:
  reset: fixture
