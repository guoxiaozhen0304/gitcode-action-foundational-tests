id: SEC-ARTF-01-001
dimensions: ["security"]
dimension: security
priority: P0
title: "fork PR 上传的 artifact 必须不可被主仓 workflow 下载或执行"
intent_ref: INTENT-SEC-019
setup:
  repo_fixture: with-artifacts
workflow: |
  on:
    pull_request:
      branches: [main]
  jobs:
    artifact-upload:
      name: Upload artifact from fork
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Create file
          run: |
            echo fork content > fork-artifact.txt
        - name: Upload artifact
          uses: upload-artifact
          with:
            name: fork-artifact
            path: fork-artifact.txt
        - name: Mark upload done
          run: |
            test -f fork-artifact.txt && echo "FORK_ARTIFACT_UPLOADED"
trigger:
  event: pull_request
  as: untrusted_contributor
  params: {}
fault_injection: null
# 注：artifact_download 断言由 harness 在主仓（maintainer）上下文对本次 PR 运行上传的
# fork-artifact 执行跨边界下载 API 检查——下载动作发生在主仓侧，无法由本（fork PR）workflow
# 的步骤执行；本 workflow 负责真实上传 artifact 作为被测对象并以 FORK_ARTIFACT_UPLOADED
# 标记上传完成（确定性断言）。
assertions:
  - type: positive
    target: run_logs
    must_contain: "FORK_ARTIFACT_UPLOADED"
  - type: negative
    target: artifact_download
    must_not_equal: "success"
  - type: positive
    target: artifact_download
    equals: "404_or_permission_denied"
teardown:
  reset: fixture
