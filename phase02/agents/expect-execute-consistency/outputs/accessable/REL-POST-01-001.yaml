id: REL-POST-01-001
dimensions: [reliability, completeness]
dimension: reliability
priority: P1
title: "post 后处理阶段失败语义——run_always=true 下 post 失败对 workflow 结论的影响应确定可预期"
intent_ref: INTENT-REL-083
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
workflow: |
  on:
    workflow_dispatch:
  jobs:
    main_ok:
      name: main success job
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: main step
          run: |
            echo "main_ok_marker"
  post:
    run_always: true
    steps:
      - name: post notify step
        run: |
          echo "post_executed_marker"
          exit 1
trigger:
  event: workflow_dispatch
  as: maintainer
  params:
    variant_groups: "a_main_ok_post_fail; b_main_fail_post_ok; c_post_over_timeout"
    note: "harness 按组分别注入主步骤失败与 post 超时变体"
fault_injection: null
assertions:
  - type: positive
    target: conclusion_matches_documented_semantics
    equals: "true"
  - type: positive
    target: post_failure_attribution_visible
    equals: "true"
  - type: negative
    target: silent_post_swallow_detected
    equals: "true"
  - type: negative
    target: post_hang_beyond_timeout_detected
    equals: "true"
teardown:
  reset: fixture
