id: COMP-EXPR-01-055
dimensions: [completeness]
dimension: completeness
priority: P1
title: hashFiles 函数边界行为
intent_ref: INTENT-COMP-055
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  jobs:
    verify:
      name: Verify hashFiles boundary
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Single file hash
          run: |
            H="${{ hashFiles('package.json') }}"
            echo "HASH_SINGLE=$H"
            [[ "$H" =~ ^[0-9a-f]{64}$ ]] && echo "SINGLE_HEX64=yes" || echo "SINGLE_HEX64=no"
        - name: Multi pattern hash
          run: |
            H="${{ hashFiles('src/**', 'package.json') }}"
            echo "HASH_MULTI=$H"
            [[ "$H" =~ ^[0-9a-f]{64}$ ]] && echo "MULTI_HEX64=yes" || echo "MULTI_HEX64=no"
        - name: No match hash
          run: |
            H="${{ hashFiles('nonexistent.xyz') }}"
            echo "HASH_NONE=$H"
            [ -z "$H" ] && echo "NONE_EMPTY=yes" || echo "NONE_EMPTY=no"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: positive
    target: run_logs
    must_contain: SINGLE_HEX64=yes
  - type: positive
    target: run_logs
    must_contain: MULTI_HEX64=yes
  - type: positive
    target: run_logs
    must_contain: NONE_EMPTY=yes
teardown:
  reset: fixture
