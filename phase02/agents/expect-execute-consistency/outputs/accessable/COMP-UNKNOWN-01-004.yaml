id: COMP-UNKNOWN-01-004
dimensions: [completeness]
dimension: completeness
priority: P1
title: select 与 selected_by_default 声明时的实际行为记录
intent_ref: INTENT-COMP-021
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  stages:
    gated_stage:
      select: selected_by_default
      jobs:
        beta:
          name: Job with select
          select: selected_by_default
          runs-on: [ubuntu-latest, x64, small]
          steps:
            - name: Mark beta
              run: |
                echo "SELECT_JOB_RAN"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: nonfunctional
    target: select_handling
    eval: llm_assisted
    rubric: 逐字记录 select 字段的处理（校验报错 / 静默忽略 / 生效），并与未声明场景（COMP-UNKNOWN-01-003）对比判定等价性
  - type: negative
    target: run_logs
    eval: llm_assisted
    rubric: 不应出现 select 看似声明实则无效（被静默忽略）且无任何提示
teardown:
  reset: fixture
