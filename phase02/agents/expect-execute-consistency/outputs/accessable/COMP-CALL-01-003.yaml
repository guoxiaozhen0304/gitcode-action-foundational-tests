id: COMP-CALL-01-003
dimensions: [completeness, security]
dimension: completeness
priority: P1
title: 本地路径 workflow_call 完整 secrets 映射正常执行
intent_ref: INTENT-COMP-030
setup:
  repo_fixture: reusable-workflow-local
  secrets: [OBS_AK, OBS_SK]
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  jobs:
    caller:
      name: Call local reusable workflow
      uses: ./.gitcode/workflows/reusable.yml
      secrets:
        OBS_AK: "${{ secrets.OBS_AK }}"
        OBS_SK: "${{ secrets.OBS_SK }}"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: positive
    target: run_status
    equals: success
  - type: positive
    target: run_logs
    must_contain: REUSABLE_OK
teardown:
  reset: fixture
