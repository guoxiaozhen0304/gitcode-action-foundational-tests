id: COMP-CALL-01-004
dimensions: [completeness, security]
dimension: completeness
priority: P1
title: 未传 required secret 的 workflow_call 不应空值执行
intent_ref: INTENT-COMP-030
setup:
  repo_fixture: reusable-workflow-local
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  jobs:
    caller:
      name: Call reusable missing secret
      uses: ./.gitcode/workflows/reusable.yml
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: negative
    target: run_status
    equals: success
  - type: negative
    target: run_logs
    must_contain: UPLOAD_DONE
  - type: nonfunctional
    target: error_message
    eval: llm_assisted
    rubric: 缺参报错信息应指明缺失的 secret 名；逐字记录实际处理（校验报错 / 运行期空值 / 静默通过）
teardown:
  reset: fixture
