id: REL-CACHE-01-048
dimensions: [reliability]
dimension: reliability
priority: P2
title: "cache 同 key 并发写一致性——3 方并行写同一 key 不得产生混合/损坏内容"
intent_ref: INTENT-REL-079
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
workflow: |
  on:
    workflow_dispatch:
  jobs:
    writer:
      name: concurrent cache writer job
      runs-on: [ubuntu-latest, x64, small]
      strategy:
        matrix:
          writer_id: [alpha, beta, gamma]
        fail-fast: false
      steps:
        - name: cache write step
          uses: cache
          with:
            path: shared_cache
            key: concurrent-same-key-probe
        - name: write marker step
          run: |
            mkdir -p shared_cache
            echo "writer_${{ matrix.writer_id }}_full_content_marker" > shared_cache/owner.txt
    verify:
      name: cache readback verify job
      runs-on: [ubuntu-latest, x64, small]
      needs: writer
      steps:
        - name: cache restore step
          uses: cache
          with:
            path: shared_cache
            key: concurrent-same-key-probe
        - name: check attribution step
          run: |
            cat shared_cache/owner.txt || echo "cache_miss"
trigger:
  event: workflow_dispatch
  as: maintainer
  params:
    concurrent_writers: 3
fault_injection: null
assertions:
  - type: positive
    target: cache_content_attribution
    equals: "single_writer_complete_or_explicit_conflict_error"
  - type: negative
    target: mixed_or_truncated_content_detected
    equals: "true"
  - type: nonfunctional
    target: concurrent_write_semantics
    equals: "recorded"
teardown:
  reset: fixture
