id: COMPAT-PR-01-008
dimensions: [compatibility]
dimension: compatibility
priority: P1
title: "pull_request 不支持的 activity type（ready_for_review）不应静默不触发"
intent_ref: INTENT-COMPAT-038

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    pull_request:
      branches: [main]
      types: [ready_for_review]
  jobs:
    probe:
      name: Probe unsupported ready_for_review type
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Should run only if type supported
          run: |
            echo "RFR_TYPE_JOB_RAN"

trigger:
  event: pull_request
  as: maintainer
  params:
    activity: "draft to ready for review"

fault_injection: null

assertions:
  - type: negative
    target: run_list
    eval: llm_assisted
    rubric: "若 workflow 被静默接受，draft PR 转正式后既不触发运行也无任何不支持提示，记为静默失效缺陷"
  - type: positive
    target: save_result
    eval: llm_assisted
    rubric: "解析或保存阶段应明确报错并列出 GitCode 合法 types 取值 open/reopen/update/merge"

teardown:
  reset: fixture
