id: USE-SCHED-01-001
dimensions: ["usability", "reliability"]
dimension: usability
priority: P1
title: "schedule 不触发时的可观测提示（判定方式：llm_assisted）"
intent_ref: INTENT-USE-047

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    schedule:
      - cron: "0 0 * * *"
  jobs:
    nightly:
      name: nightly schedule probe
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: marker step
          run: |
            echo "scheduled run"

trigger:
  event: schedule
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: negative
    target: ui
    eval: "llm_assisted"
    rubric: "schedule 未触发时，平台不应完全静默：workflow 列表或详情页应给出任何可观测线索；完全无提示即不合格"
  - type: nonfunctional
    target: ui
    eval: "llm_assisted"
    rubric: "用户在不查文档的情况下，应能通过 UI 信息区分 cron 写错与平台故障两类原因；workflow 列表应显示下次预计触发时间，跳过的触发应留 skipped 记录并附原因；调度器正确性由 REL-085 覆盖，本条仅判可观测性"

teardown:
  reset: fixture
