id: USE-ACT-01-004
dimensions: ["usability"]
dimension: usability
priority: P1
title: "文档短名与市场名两种写法解析一致性验证"
intent_ref: INTENT-USE-052

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    short-name:
      name: official short name reference
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: checkout source
          uses: checkout
        - name: use cache short name
          uses: cache
          with:
            path: ~/.cache
            key: probe-cache-key
    market-name:
      name: market name reference
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: use cache market name
          uses: AtomgitCache

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: validation_result
    eval: "deterministic"
    criterion: "分别记录 cache 短名与 AtomgitCache 市场名的解析结果；是否解析到同一插件需与 USE-ACT-01-003 文档映射合并判定"

teardown:
  reset: none
