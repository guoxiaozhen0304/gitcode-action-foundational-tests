id: REL-DEBOUNCE-01-002
dimensions: [reliability]
dimension: reliability
priority: P1
title: "触发幂等——10 秒内推送 10 个 tag 的 run 记录应与 tag 事件 100% 可解释"
intent_ref: INTENT-REL-073
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
workflow: |
  on:
    push:
      tags:
        - "v*"
  jobs:
    test:
      name: tag debounce probe job
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: record ref step
          run: |
            echo "trigger_ref=${{ atomgit.ref }}"
trigger:
  event: tag
  as: maintainer
  params:
    tag_count: 10
    window_seconds: 10
    tag_pattern: "v*"
fault_injection: null
assertions:
  - type: positive
    target: tag_event_run_reconciliation
    equals: "10/10_or_documented_debounce"
  - type: positive
    target: same_tag_duplicate_runs_count
    equals: "0"
  - type: negative
    target: unexplained_run_loss_detected
    equals: "true"
teardown:
  reset: fixture
