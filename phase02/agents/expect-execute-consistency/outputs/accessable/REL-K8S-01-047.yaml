id: REL-K8S-01-047
dimensions: [reliability]
dimension: reliability
priority: P1
title: "Karmada 多集群接入、聚合资源发现与指定成员集群调度"
intent_ref: INTENT-REL-087
setup:
  repo_fixture: default
  secrets: []
  variables:
    member_clusters: ">=2"
    npu_models: "heterogeneous"
  branch_protection: default
workflow: null
trigger:
  event: manual
  as: maintainer
  params:
    platform_op: karmada_multi_cluster_onboarding
fault_injection: null
assertions:
  - type: positive
    target: cluster_onboarding_status
    equals: "success"
  - type: positive
    target: aggregated_resource_view
    eval: llm_assisted
    rubric: "Karmada 聚合资源视图应等于各成员集群 NPU 资源之和。输入退化声明：oracle 仅有 xlsx 预期结果列（接入成功/能正常运行，实测未执行），聚合正确性细项无平台侧文档支撑，需结合实测环境判定"
  - type: positive
    target: designated_cluster_pod_status
    equals: "Running"
  - type: negative
    target: aggregated_resource_view
    eval: llm_assisted
    rubric: "聚合视图不应漏计或重复计数；指定成员集群提交的 pod 不应漂移到其他集群"
teardown:
  reset: fixture
