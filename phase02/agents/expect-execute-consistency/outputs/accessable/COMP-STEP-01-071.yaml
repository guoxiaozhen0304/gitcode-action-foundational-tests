id: COMP-STEP-01-071
dimensions: [completeness]
dimension: completeness
priority: P1
title: step 执行控制 shell working-directory continue-on-error timeout-minutes 验证
intent_ref: INTENT-COMP-069
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  jobs:
    verify:
      name: Verify step execution control
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Bash shell
          shell: bash
          run: |
            echo "bash_ok"
        - name: Sh shell
          shell: sh
          run: |
            echo "sh_ok"
        - name: Working directory
          working-directory: /tmp
          run: |
            echo "PWD_NOW=$(pwd)"
        - name: Continue on error
          continue-on-error: true
          run: |
            echo "before_fail"
            exit 1
        - name: After continue
          run: |
            echo "continue_ok"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: positive
    target: run_status
    equals: success
  - type: positive
    target: run_logs
    must_contain: bash_ok
  - type: positive
    target: run_logs
    must_contain: sh_ok
  - type: positive
    target: run_logs
    must_contain: PWD_NOW=/tmp
  - type: positive
    target: run_logs
    must_contain: before_fail
  - type: positive
    target: run_logs
    must_contain: continue_ok
teardown:
  reset: fixture
