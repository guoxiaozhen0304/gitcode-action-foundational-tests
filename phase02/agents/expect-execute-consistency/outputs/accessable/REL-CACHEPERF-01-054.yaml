id: REL-CACHEPERF-01-054
dimensions: [reliability]
dimension: reliability
priority: P2
title: "缓存加速比——cache 命中 vs 未命中构建耗时对比"
intent_ref: INTENT-REL-054
setup:
  repo_fixture: with-cache
  secrets: []
  variables: {}
  branch_protection: default
workflow: |
  on:
    workflow_dispatch:
  jobs:
    test:
      name: cache speedup test
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: restore cache
          uses: cache
          with:
            path: node_modules
            key: cache-deps-fixed
        - name: install deps timed
          run: |
            START=$(date +%s)
            if [ -f package.json ]; then
              npm ci
            else
              echo "NO_PACKAGE_JSON_SKIP"
            fi
            END=$(date +%s)
            echo "INSTALL_DURATION_SECONDS=$((END-START))"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
fault_injection: null
# 注：speedup_ratio/restore_time_seconds 为跨 run（命中 vs 未命中）的性能对比指标，由 harness
# 测量；workflow 输出 INSTALL_DURATION_SECONDS 计时标记作为测量材料与确定性锚点。
assertions:
  - type: nonfunctional
    target: speedup_ratio
    ge: "2"
  - type: nonfunctional
    target: restore_time_seconds
    le: "30"
  - type: positive
    target: run_logs
    must_contain: "INSTALL_DURATION_SECONDS="
teardown:
  reset: fixture
