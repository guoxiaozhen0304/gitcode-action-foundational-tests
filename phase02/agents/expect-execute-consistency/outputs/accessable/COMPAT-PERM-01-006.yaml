id: COMPAT-PERM-01-006
dimensions: [compatibility, security]
dimension: compatibility
priority: P1
title: "job 级 permissions 字段的支持度与降级方式（权限不得宽于声明）"
intent_ref: INTENT-COMPAT-053

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  permissions:
    contents: read
  jobs:
    probe:
      name: Probe job level permissions field
      permissions:
        contents: write
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Mark if job ran
          run: |
            echo "JOB_LEVEL_PERM_JOB_RAN"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: negative
    target: run_status
    eval: llm_assisted
    rubric: "含 job 级 permissions 的 workflow 不应被静默接受后运行且该 job 实际获得 workflow 级或更宽权限；若实测为静默忽略导致权限宽于声明，按 gate-log 裁决执行期直接记 blocker 缺陷"
  - type: positive
    target: save_result
    eval: llm_assisted
    rubric: "不支持时解析期应明确报错（预期 unknown property），信息指明 job 级 permissions 不可用及替代（提升到 workflow 级）；若支持则核验覆盖语义为替换而非并集"
  - type: nonfunctional
    target: save_result
    eval: llm_assisted
    rubric: "覆盖语义（替换 vs 合并）与支持度结论文档化，回写 Parity Matrix permissions 行"

teardown:
  reset: fixture
