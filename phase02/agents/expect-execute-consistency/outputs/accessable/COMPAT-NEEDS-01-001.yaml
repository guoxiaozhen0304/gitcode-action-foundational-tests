id: COMPAT-NEEDS-01-001
dimensions: [compatibility]
dimension: compatibility
priority: P1
title: "needs 上下文存在性与 outputs/result 字段对齐（规格矛盾仲裁）"
intent_ref: INTENT-COMPAT-041

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    build:
      name: Produce version output
      runs-on: [ubuntu-latest, x64, small]
      outputs:
        version: ${{ steps.gen.outputs.version }}
      steps:
        - name: Generate version output
          id: gen
          run: |
            echo "version=1.2.3" >> "$ATOMGIT_OUTPUT"
    consume:
      name: Consume needs context
      needs: build
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Read needs outputs and result
          run: |
            echo "NEEDS_VERSION=${{ needs.build.outputs.version }}"
            echo "NEEDS_RESULT=${{ needs.build.result }}"
            echo "PROBE_DONE"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_logs
    must_contain: "NEEDS_VERSION=1.2.3"
  - type: positive
    target: run_logs
    eval: llm_assisted
    rubric: "NEEDS_RESULT 应存在且上游成功时取值为 success，与 GitHub needs.<job>.result 语义对齐；字段缺失或取值不同记录为差异"
  - type: negative
    target: run_logs
    eval: llm_assisted
    rubric: "needs 上下文在表达式中不应解析报错；若 if 中不可用而文档未声明，记为规格缺陷"

teardown:
  reset: fixture
