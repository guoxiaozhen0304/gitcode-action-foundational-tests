id: COMP-ATOMGIT-01-048
dimensions: [completeness]
dimension: completeness
priority: P1
title: atomgit 事件相关属性可访问性
intent_ref: INTENT-COMP-048
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    push:
      branches: [main]
  jobs:
    verify:
      name: Verify event properties on push
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Print event properties
          run: |
            echo "EVENT_REF=${{ atomgit.event.ref }}"
            echo "BEFORE=${{ atomgit.event.before }}"
            echo "AFTER=${{ atomgit.event.after }}"
            echo "BASE_REF=${{ atomgit.event.base_ref }}"
            echo "CREATED=${{ atomgit.event.created }}"
            echo "DELETED=${{ atomgit.event.deleted }}"
        - name: Check event ref consistency
          run: |
            if [ "${{ atomgit.event.ref }}" = "${{ atomgit.ref }}" ]; then
              echo "REF_CONSISTENT=yes"
            else
              echo "REF_CONSISTENT=no"
            fi
        - name: Check sha formats and commits
          run: |
            BEFORE="${{ atomgit.event.before }}"
            AFTER="${{ atomgit.event.after }}"
            [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && echo "BEFORE_HEX40=yes" || echo "BEFORE_HEX40=no"
            [[ "$AFTER" =~ ^[0-9a-f]{40}$ ]] && echo "AFTER_HEX40=yes" || echo "AFTER_HEX40=no"
            COMMITS="${{ atomgit.event.commits }}"
            echo "COMMITS_LEN=${#COMMITS}"
trigger:
  event: push
  as: maintainer
  params: {}
assertions:
  - type: positive
    target: run_logs
    must_contain: EVENT_REF=refs/
  - type: positive
    target: run_logs
    must_contain: BEFORE_HEX40=yes
  - type: positive
    target: run_logs
    must_contain: AFTER_HEX40=yes
  - type: positive
    target: run_logs
    must_contain: COMMITS_LEN=
  - type: positive
    target: run_logs
    must_contain: REF_CONSISTENT=yes
teardown:
  reset: fixture
