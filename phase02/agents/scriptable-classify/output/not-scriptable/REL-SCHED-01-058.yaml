id: REL-SCHED-01-058
dimensions: [reliability]
dimension: reliability
priority: P1
title: "schedule 触发准点性与丢失率——cron 最短 5 分钟间隔下 2 小时窗口的触发可靠性"
intent_ref: INTENT-REL-085
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
workflow: |
  on:
    schedule:
      - cron: "*/5 * * * *"
  jobs:
    tick:
      name: schedule tick job
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: tick step
          run: |
            echo "schedule_tick $(date -u +%FT%TZ)"
trigger:
  event: schedule
  as: maintainer
  params:
    observe_window_hours: 2
    expected_triggers: 24
    control_group: non_default_branch_same_config
fault_injection: null
assertions:
  - type: positive
    target: runs_on_default_branch_head
    equals: "true"
  - type: positive
    target: duplicate_trigger_count
    equals: "0"
  - type: negative
    target: non_default_branch_triggered
    equals: "true"
  - type: nonfunctional
    target: trigger_loss_rate_pct
    le: "5"
  - type: nonfunctional
    target: trigger_delay_p95_seconds
    le: "300"
teardown:
  reset: fixture
