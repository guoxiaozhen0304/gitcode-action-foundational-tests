id: SEC-BASE-01-002
dimensions: ["security"]
dimension: security
priority: P0
title: "fork PR 改 workflow 不被 pull_request_target 采用"
intent_ref: INTENT-SEC-035
setup:
  repo_fixture: with-secrets
  secrets: ["DEPLOY_TOKEN"]
workflow: |
  on:
    pull_request_target:
      branches: [main]
  jobs:
    reject-fork-wf:
      name: Reject fork workflow changes
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: checkout base source
          uses: checkout
        - name: Verify base workflow only
          run: |
            echo "WORKFLOW_REF=${{ atomgit.ref }}"
            if [ -n "$(ls -A)" ]; then
              echo "base_branch_workflow_executed"
            else
              echo "BASE_CHECKOUT_EMPTY"
              exit 1
            fi
trigger:
  event: pull_request_target
  as: maintainer
  params: {}
fault_injection: null
assertions:
  - type: negative
    target: run_logs
    must_not_contain: "fork_injected_step"
  - type: positive
    target: run_status
    equals: "success"
  - type: positive
    target: run_logs
    must_contain: "base_branch_workflow_executed"
teardown:
  reset: fixture
