id: REL-ARTPERF-01-053
dimensions: [reliability]
dimension: reliability
priority: P1
title: "制品传输性能——100MB artifact 上传下载耗时"
intent_ref: INTENT-REL-053
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
workflow: |
  on:
    workflow_dispatch:
  jobs:
    upload:
      name: upload artifact job
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: generate 100MB file
          run: |
            dd if=/dev/urandom of=artifact.bin bs=1M count=100
            md5sum artifact.bin > md5.txt
            echo "SOURCE_MD5=$(cut -d' ' -f1 md5.txt)"
        - name: upload artifact step
          uses: upload-artifact
          with:
            name: perf-artifact
            path: |
              artifact.bin
              md5.txt
    download:
      name: download artifact job
      runs-on: [ubuntu-latest, x64, small]
      needs: upload
      steps:
        - name: download artifact step
          uses: download-artifact
          with:
            name: perf-artifact
        - name: verify artifact hash
          run: |
            DOWNLOAD_MD5=$(md5sum artifact.bin | cut -d' ' -f1)
            SOURCE_MD5=$(cut -d' ' -f1 md5.txt)
            echo "SOURCE_MD5=$SOURCE_MD5"
            echo "DOWNLOAD_MD5=$DOWNLOAD_MD5"
            if [ "$SOURCE_MD5" = "$DOWNLOAD_MD5" ]; then
              echo "HASH_MATCH_OK"
            else
              echo "HASH_MISMATCH"
              exit 1
            fi
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
fault_injection: null
assertions:
  - type: nonfunctional
    target: upload_time_seconds
    le: "30"
  - type: nonfunctional
    target: download_time_seconds
    le: "30"
  - type: positive
    target: run_logs
    must_contain: "HASH_MATCH_OK"
  - type: negative
    target: run_logs
    must_not_contain: "HASH_MISMATCH"
teardown:
  reset: fixture
