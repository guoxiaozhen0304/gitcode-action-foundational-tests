id: REL-REG-01-001
dimensions: [reliability, completeness]
dimension: reliability
priority: P1
title: "新仓库 workflow 注册——首次 push 含合法流水线配置即应触发，无需手动再改一次"
intent_ref: INTENT-REL-072
setup:
  repo_fixture: fresh-repo
  secrets: []
  variables: {}
  branch_protection: default
workflow: |
  on:
    push:
  jobs:
    test:
      name: first registration probe job
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: probe step
          run: |
            echo "first_push_registration_probe"
trigger:
  event: push
  as: maintainer
  params:
    new_repo_count: 3
fault_injection: null
assertions:
  - type: positive
    target: run_created
    equals: "true"
  - type: negative
    target: run_records_count
    equals: "0"
  - type: nonfunctional
    target: registration_delay_seconds
    le: "300"
  - type: nonfunctional
    target: successful_repo_ratio
    equals: "3/3"
teardown:
  reset: fixture
