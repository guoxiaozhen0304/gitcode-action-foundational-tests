id: COMP-SCRIPT-01-081
dimensions: [completeness]
dimension: completeness
priority: P1
title: 仓库内脚本执行与路径验证
intent_ref: INTENT-COMP-081
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  jobs:
    verify:
      name: Verify in-repo script execution
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: checkout source
          uses: checkout
        - name: Run inline script
          run: |
            echo "inline_script_ok"
        - name: Run repo script
          run: |
            if [ -f scripts/hello.sh ]; then
              chmod +x scripts/hello.sh
              ./scripts/hello.sh
              echo "REPO_SCRIPT_RAN_OK"
            else
              echo "REPO_SCRIPT_MISSING"
              exit 1
            fi
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: positive
    target: run_logs
    must_contain: REPO_SCRIPT_RAN_OK
  - type: negative
    target: run_logs
    must_not_contain: REPO_SCRIPT_MISSING
teardown:
  reset: fixture
