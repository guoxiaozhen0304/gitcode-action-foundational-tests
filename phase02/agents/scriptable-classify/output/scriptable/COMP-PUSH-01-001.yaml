id: COMP-PUSH-01-001
dimensions: [completeness]
dimension: completeness
priority: P1
title: 匹配 branches 的 push 正确触发 workflow
intent_ref: INTENT-COMP-003

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    push:
      branches:
        - main
  jobs:
    verify:
      name: Verify branch trigger
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Verify branch trigger
          run: |
            echo "TRIGGER_REF=${{ atomgit.ref }}"
            if [ "${{ atomgit.ref }}" = "refs/heads/main" ]; then
              echo "TRIGGERED_ON_MAIN_OK"
            else
              echo "TRIGGERED_ON_WRONG_BRANCH"
              exit 1
            fi

trigger:
  event: push
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_status
    equals: success
  - type: positive
    target: run_event
    equals: push
  - type: positive
    target: run_logs
    must_contain: "TRIGGERED_ON_MAIN_OK"

teardown:
  reset: none
