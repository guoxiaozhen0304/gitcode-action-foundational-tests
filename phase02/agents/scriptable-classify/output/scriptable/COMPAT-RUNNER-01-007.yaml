id: COMPAT-RUNNER-01-007
dimensions: [compatibility]
dimension: compatibility
priority: P1
title: "Runner 预装工具链规格清单与实测全面对账"
intent_ref: INTENT-COMPAT-047

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    probe:
      name: Audit preinstalled toolchain against spec
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Probe java and maven and gradle
          run: |
            java -version 2>&1 | head -1 || echo "JAVA_MISSING"
            mvn -version 2>&1 | head -1 || echo "MVN_MISSING"
            gradle -version 2>&1 | head -3 || echo "GRADLE_MISSING"
        - name: Probe node go kubectl awscli
          run: |
            node --version 2>&1 || echo "NODE_MISSING"
            go version 2>&1 || echo "GO_MISSING"
            kubectl version --client 2>&1 | head -1 || echo "KUBECTL_MISSING"
            aws --version 2>&1 || echo "AWSCLI_MISSING"
            echo "AUDIT_DONE"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_logs
    must_contain: "AUDIT_DONE"
  - type: positive
    target: run_logs
    eval: llm_assisted
    rubric: "逐项比对 runner-images-tools.md 预装清单：每个工具应存在且版本与文档一致；任一文档列出但实测 MISSING 的项（NEW-011 已疑 Java）记为规格失实缺陷"
  - type: negative
    target: run_logs
    eval: llm_assisted
    rubric: "不应出现文档列出但实测缺失的工具而未登记缺陷"

teardown:
  reset: fixture
