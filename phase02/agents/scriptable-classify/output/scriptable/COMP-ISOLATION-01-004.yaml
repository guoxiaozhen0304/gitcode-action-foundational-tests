id: COMP-ISOLATION-01-004
dimensions: [completeness, security]
dimension: completeness
priority: P1
title: 托管 Runner 上特权 options 与敏感路径挂载的边界核查
intent_ref: INTENT-COMP-025
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  jobs:
    escalate:
      name: Probe privileged container boundary
      runs-on: [ubuntu-latest, x64, small]
      container:
        image: ubuntu:22.04
        options: --privileged --network=host
        volumes:
          - /:/host-root
      steps:
        - name: Probe host access
          run: |
            if [ -d /host-root/etc ]; then echo "HOST_ROOT_READABLE"; else echo "HOST_ROOT_BLOCKED"; fi
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: negative
    target: run_logs
    must_contain: HOST_ROOT_READABLE
  - type: negative
    target: privilege_boundary
    eval: llm_assisted
    rubric: 托管 Runner 上不应无限制放行提权类 docker options（--privileged、--network=host）与宿主根路径挂载；逐字记录拒绝/放行事实，放行则回写风险登记册（安全深测由 SEC 维度承接）
teardown:
  reset: fixture
