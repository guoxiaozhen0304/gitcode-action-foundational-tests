id: COMPAT-WCMD-01-004
dimensions: [compatibility]
dimension: compatibility
priority: P1
title: "注解命令 error/warning/notice 的不中断降级行为"
intent_ref: INTENT-COMPAT-042

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    probe:
      name: Probe annotation command degradation
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Emit error warning notice commands
          run: |
            echo "::error::demo error annotation"
            echo "::warning::demo warning annotation"
            echo "::notice::demo notice annotation"
        - name: Confirm subsequent commands run
          run: |
            echo "AFTER_ANNOTATION_OK"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_status
    equals: success
  - type: positive
    target: run_logs
    must_contain: "AFTER_ANNOTATION_OK"
  - type: negative
    target: run_logs
    eval: llm_assisted
    rubric: "注解命令行之后不应出现日志截断、乱码或后续行丢失；出现即记为解析副作用缺陷"

teardown:
  reset: fixture
