id: COMPAT-WCMD-01-005
dimensions: [compatibility]
dimension: compatibility
priority: P1
title: "debug 命令默认可见性与 GitHub ACTIONS_STEP_DEBUG 门控差异"
intent_ref: INTENT-COMPAT-042

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    probe:
      name: Probe debug command visibility
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Emit debug command
          run: |
            echo "::debug::demo debug message"
            echo "DEBUG_PROBE_DONE"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_logs
    must_contain: "DEBUG_PROBE_DONE"
  - type: positive
    target: run_logs
    eval: llm_assisted
    rubric: "确认 demo debug message 在默认配置下是否可见；可见或隐藏均可接受但必须确定且文档化，并与 GitHub ACTIONS_STEP_DEBUG 门控机制的差异写入迁移对照"

teardown:
  reset: fixture
