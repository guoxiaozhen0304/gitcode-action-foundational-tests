id: USE-UNKN-01-004
dimensions: ["usability", "compatibility"]
dimension: usability
priority: P1
title: "未文档化字段 select/manual_override/code-update/顶层 inputs 的文档集合 diff"
intent_ref: INTENT-USE-037

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: null

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: negative
    target: documentation
    eval: "deterministic"
    criterion: "样本 YAML key 集合与文档合法 key 集合 diff；select、manual_override、code-update、顶层 inputs 等样本独有 key 数量应为 0，每多 1 个即一条缺陷；字段行为裁定归 COMP-021/031"

teardown:
  reset: none
