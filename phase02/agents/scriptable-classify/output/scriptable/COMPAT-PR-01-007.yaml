id: COMPAT-PR-01-007
dimensions: [compatibility]
dimension: compatibility
priority: P1
title: "pull_request 不支持的 activity type（labeled）不应静默退化"
intent_ref: INTENT-COMPAT-038

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    pull_request:
      branches: [main]
      types: [labeled]
  jobs:
    probe:
      name: Probe unsupported labeled type
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Should not run for unlabeled activity
          run: |
            echo "LABELED_TYPE_JOB_RAN"

trigger:
  event: pull_request
  as: maintainer
  params:
    activity: "synchronize-equivalent update (non-labeled)"

fault_injection: null

assertions:
  - type: negative
    target: run_list
    eval: llm_assisted
    rubric: "若 workflow 被静默接受，对 PR 执行非 labeled 的普通活动不应触发运行；出现运行即证明 types 过滤被静默忽略，记为缺陷"
  - type: positive
    target: save_result
    eval: llm_assisted
    rubric: "解析或保存阶段应明确报错并列出 GitCode 合法 types 取值 open/reopen/update/merge"

teardown:
  reset: fixture
