id: REL-NEEDS-01-027
dimensions: [reliability, completeness]
dimension: reliability
priority: P0
title: "needs 依赖 matrix job 部分失败——无 if 条件的下游 job 应 skipped 而非执行"
intent_ref: INTENT-REL-069
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
workflow: |
  on:
    workflow_dispatch:
  jobs:
    job_b:
      name: matrix upstream job partial fail
      runs-on: [ubuntu-latest, x64, small]
      strategy:
        matrix:
          version: [1, 2, 3]
        fail-fast: false
      steps:
        - name: maybe fail step
          run: |
            if [ "${{ matrix.version }}" = "2" ]; then exit 1; fi
            echo "matrix_instance_ok=${{ matrix.version }}"
    job_a:
      name: downstream aggregator job
      runs-on: [ubuntu-latest, x64, small]
      needs: job_b
      steps:
        - name: should be skipped step
          run: |
            echo "this should not run"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
fault_injection: null
assertions:
  - type: positive
    target: job_b_status
    equals: "failure"
  - type: positive
    target: job_a_status
    equals: "skipped"
  - type: positive
    target: succeeded_instances_count
    equals: "2"
  - type: negative
    target: job_a_status
    equals: "success"
teardown:
  reset: none
