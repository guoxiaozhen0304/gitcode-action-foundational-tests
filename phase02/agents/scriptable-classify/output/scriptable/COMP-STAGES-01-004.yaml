id: COMP-STAGES-01-004
dimensions: [completeness, usability]
dimension: completeness
priority: P1
title: map 形式 stages 按定义顺序串行执行（回归保护）
intent_ref: INTENT-COMP-019
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  stages:
    build_stage:
      jobs:
        build:
          name: Stage one job
          runs-on: [ubuntu-latest, x64, small]
          steps:
            - name: Produce stage one output
              run: |
                echo "stage_one_artifact_content" > stage_one.out
                echo "STAGE_ONE_DONE"
            - name: upload stage one output
              uses: upload-artifact
              with:
                name: stage-one-out
                path: stage_one.out
    test_stage:
      jobs:
        test:
          name: Stage two job
          runs-on: [ubuntu-latest, x64, small]
          steps:
            - name: download stage one output
              uses: download-artifact
              with:
                name: stage-one-out
            - name: Verify stage one completed first
              run: |
                if grep -q "stage_one_artifact_content" stage_one.out; then
                  echo "STAGE_ORDER_OK"
                  echo "STAGE_TWO_DONE"
                else
                  echo "STAGE_ORDER_BROKEN"
                  exit 1
                fi
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: positive
    target: run_status
    equals: success
  - type: positive
    target: run_logs
    must_contain: STAGE_ONE_DONE
  - type: positive
    target: run_logs
    must_contain: STAGE_TWO_DONE
  - type: positive
    target: run_logs
    must_contain: STAGE_ORDER_OK
  - type: negative
    target: run_logs
    must_not_contain: STAGE_ORDER_BROKEN
teardown:
  reset: fixture
