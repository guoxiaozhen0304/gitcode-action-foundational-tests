---
id: UI-SEARCH-01-001
dimensions: ["completeness"]
dimension: completeness
priority: P1
title: 在首页搜索框搜索关键词并验证结果页
intent_ref: INTENT-UI-005
test_type: ui
ui:
  url: "https://gitcode.com"
  viewport:
    width: 1280
    height: 720
  actions:
    - type: wait_for_selector
      selector: "input[placeholder*='搜索']"
      timeout: 10000
    - type: fill
      selector: "input[placeholder*='搜索']"
      value: "openeuler"
    - type: click
      selector: "button[type='submit']"
    - type: wait
      ms: 3000
assertions:
  - type: positive
    target: ui_page_title
    text: "搜索"
  - type: positive
    target: ui_text_contains
    selector: "body"
    text: "openeuler"
teardown:
  reset: none
