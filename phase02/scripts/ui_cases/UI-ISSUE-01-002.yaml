---
id: UI-ISSUE-01-002
dimensions: ["completeness"]
dimension: completeness
priority: P1
title: 在 Web 页面创建 Issue 并验证跳转
intent_ref: INTENT-UI-007
test_type: ui
ui:
  url: "https://gitcode.com/{owner}/{repo}/issues"
  viewport:
    width: 1280
    height: 720
  actions:
    - type: wait_for_selector
      selector: "button.search-bar-create"
      timeout: 10000
    - type: click
      selector: "button.search-bar-create"
    - type: wait
      ms: 3000
    - type: wait_for_selector
      selector: "input.devui-input__inner:visible"
      timeout: 10000
    - type: type
      selector: "input.devui-input__inner:visible"
      value: "UI自动化测试 Issue"
    - type: type
      selector: "textarea:visible"
      value: "由 ui_runner 自动创建的测试 Issue。"
    - type: click
      selector: "button:has-text('新建 Issue')"
    - type: wait
      ms: 8000
assertions:
  - type: positive
    target: ui_page_title
    text: "UI自动化测试 Issue"
  - type: positive
    target: ui_text_contains
    selector: "body"
    text: "UI自动化测试 Issue"
teardown:
  reset: none
