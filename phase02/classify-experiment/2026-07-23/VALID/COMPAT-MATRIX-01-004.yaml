id: COMPAT-MATRIX-01-004
dimensions: [compatibility]
dimension: compatibility
priority: P2
title: "matrix include 无基础变量不被支持时的差异"
intent_ref: INTENT-COMPAT-NEW-007

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    test-matrix-include:
      name: Test matrix include without base vars
      runs-on: [ubuntu-latest, x64, small]
      strategy:
        matrix:
          include:
            - os: ubuntu
              node: 20
      steps:
        - name: Echo matrix values
          run: |
            echo "os=${{ matrix.os }}"
            echo "node=${{ matrix.node }}"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_status
    equals: "success"
  - type: positive
    target: generated_jobs_count
    equals: "1"
  - type: positive
    target: run_logs
    contains: "node=20"

teardown:
  reset: none
