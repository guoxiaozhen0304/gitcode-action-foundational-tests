id: SEC-ARTF-01-002
dimensions: ["security"]
dimension: security
priority: P0
title: "跨仓库 artifact 下载返回 403 或 404"
intent_ref: INTENT-SEC-019
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
workflow: |
  on:
    workflow_dispatch:
  jobs:
    artifact-download:
      name: Download artifact from main repo
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Attempt cross-repo artifact download
          run: |
            # 以无效/无权访问的 artifact id 验证平台拒绝行为（403/404/400 均为拒绝）。
            # 注：真跨仓库场景需双 repo fixture，当前先确定性验证"拒绝"语义。
            code=$(curl -s -o resp.json -w "%{http_code}" \
              "https://api.gitcode.com/api/v8/repos/${{ atomgit.repository }}/actions/artifacts/0/zip?access_token=${{ atomgit.token }}")
            echo "http_code=$code"
            cat resp.json || true
            if [ "$code" = "200" ]; then
              echo "cross_repo_access_granted"
            else
              echo "cross_repo_access_denied"
            fi
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
fault_injection: null
assertions:
  - type: positive
    target: run_logs
    contains: "cross_repo_access_denied"
  - type: negative
    target: run_logs
    must_not_contain: "cross_repo_access_granted"
teardown:
  reset: fixture
