id: COMP-PERMS-01-001
dimensions: [completeness, security]
dimension: completeness
priority: P0
title: permissions 空对象时 ATOMGIT_TOKEN 仅 repository read
intent_ref: INTENT-COMP-013

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  permissions: {}
  jobs:
    verify:
      name: Verify empty permissions
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: checkout source
          uses: checkout
        - name: Attempt write
          run: |
            git config user.email "test@test.com"
            git config user.name "Test"
            echo "change" >> README.md
            git add README.md
            git commit -m "test"
            # 写操作结果归一化为标记：token 仅 read 时 push 应被拒 → write_denied
            if git push https://x-access-token:$ATOMGIT_TOKEN@${{ atomgit.server_url }}/${{ atomgit.repository }}.git HEAD:${{ atomgit.ref }}; then
              echo "write_succeeded"
            else
              echo "write_denied"
            fi

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_logs
    contains: "write_denied"
  - type: negative
    target: run_logs
    must_not_contain: "write_succeeded"

teardown:
  reset: none
