id: REL-ARTPERF-01-053-V2
dimensions: [reliability]
dimension: reliability
priority: P1
title: "制品传输性能——1GB artifact 上传下载耗时"
intent_ref: INTENT-REL-053
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
workflow: |
  on:
    workflow_dispatch:
  jobs:
    upload:
      name: upload artifact job
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: generate 1024MB file
          run: |
            dd if=/dev/urandom of=artifact.bin bs=1M count=1024
            md5sum artifact.bin > artifact.bin.md5
        - name: mark upload start
          run: |
            echo "upload_start=$(date +%s)"
        - name: upload artifact step
          uses: upload-artifact
          with:
            # run_id 后缀唯一命名，避免前次运行残留导致 "name already exists"
            name: perf-artifact-1g-${{ atomgit.run_id }}
            path: |
              artifact.bin
              artifact.bin.md5
        - name: mark upload end
          run: |
            echo "upload_end=$(date +%s)"
    download:
      name: download artifact job
      runs-on: [ubuntu-latest, x64, small]
      needs: upload
      steps:
        - name: mark download start
          run: |
            echo "download_start=$(date +%s)"
        - name: download artifact step
          uses: download-artifact
          with:
            name: perf-artifact-1g-${{ atomgit.run_id }}
        - name: mark download end
          run: |
            echo "download_end=$(date +%s)"
        - name: verify artifact step
          run: |
            ls -la artifact.bin
            md5sum -c artifact.bin.md5 && echo "hash_match=true"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
fault_injection: null
assertions:
  - type: nonfunctional
    target: upload_time_seconds
    le: "300"
  - type: nonfunctional
    target: download_time_seconds
    le: "300"
  - type: positive
    target: hash_match
    equals: "true"
teardown:
  reset: fixture
