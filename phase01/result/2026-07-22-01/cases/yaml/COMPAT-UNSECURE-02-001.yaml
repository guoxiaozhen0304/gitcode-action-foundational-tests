id: COMPAT-UNSECURE-02-001
dimensions: [compatibility]
dimension: compatibility
priority: P2
title: "ATOMGIT_ACTIONS_ALLOW_UNSECURE_COMMANDS 对废弃 workflow 命令的降级行为（复测 TC-220）"
intent_ref: INTENT-COMPAT-037

setup:
  repo_fixture: basic-ci
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  env:
    ATOMGIT_ACTIONS_ALLOW_UNSECURE_COMMANDS: true
  jobs:
    unsecure-test:
      name: Test unsecure commands flag
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: (TC) checkout
          uses: checkout
        - name: Try deprecated set-env
          run: |
            echo "::set-env name=DEPRECATED_VAR::hello"
            echo "set_env_attempted"
        - name: Try deprecated add-path
          run: |
            echo "::add-path::/tmp/fake-bin"
            echo "add_path_attempted"
        - name: Verify env was set
          run: |
            echo "DEPRECATED_VAR=$DEPRECATED_VAR"
            echo "PATH_CONTAINS_FAKE=$(echo $PATH | grep /tmp/fake-bin)"
            echo "verification_done"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_logs
    eval: "deterministic"
    rubric: "set_env_attempted 与 add_path_attempted 均出现在日志中（命令被接收）"
  - type: nonfunctional
    target: run_logs
    eval: "llm_assisted"
    rubric: "当 ATOMGIT_ACTIONS_ALLOW_UNSECURE_COMMANDS=true 时，::set-env/::add-path 应被支持或给出明确的替代命令提示；当未设置时，应给出清晰的废弃说明"
  - type: negative
    target: run_status
    eval: "deterministic"
    rubric: "workflow 不应因使用废弃命令而意外崩溃"

teardown:
  reset: fixture
