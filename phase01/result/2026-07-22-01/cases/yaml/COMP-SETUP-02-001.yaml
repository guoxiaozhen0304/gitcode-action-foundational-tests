id: COMP-SETUP-02-001
dimensions: [completeness]
dimension: completeness
priority: P2
title: "setup-java 内置 Action 应在 Runner 上可用（复测 TC-310）"
intent_ref: INTENT-COMP-020

setup:
  repo_fixture: basic-ci
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    setup-java-test:
      name: Test setup-java action
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: (TC) checkout
          uses: checkout
        - name: Setup Java
          uses: setup-java
          with:
            java-version: '17'
            distribution: 'temurin'
        - name: Verify Java installation
          run: |
            java -version
            echo "java_setup_complete"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_logs
    eval: "deterministic"
    rubric: "java -version 输出包含版本号（如 17）"
  - type: positive
    target: run_logs
    eval: "deterministic"
    rubric: "日志包含 java_setup_complete"
  - type: negative
    target: run_logs
    eval: "deterministic"
    rubric: "不应出现 action not found、setup-java 不存在或无法解析等错误"

teardown:
  reset: fixture
