---
id: USE-PKG-01-001
dimensions: ["usability"]
dimension: usability
priority: P2
title: 制品库版本冲突报错应包含包名、版本号与操作指引
intent_ref: INTENT-USE-009
test_type: api
setup:
  repo_fixture: ComputingActionTest/gitcode_api
api:
  endpoint: "/api/v5/repos/{owner}/{repo}/packages/npm"
  method: POST
  params: {"name": "existing-pkg", "version": "1.0.0"}
  auth: token
  expected_status: [409]
assertions:
  - type: positive
    target: api_status_code
    status_code: 409
  - type: positive
    target: api_response_body
    contains: 1.0.0
  - type: positive
    target: api_response_body
    contains: existing-pkg
teardown:
  reset: none
