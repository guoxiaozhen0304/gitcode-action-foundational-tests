---
id: API-HOOK-01-001
dimensions: ["completeness", "security"]
dimension: completeness
priority: P1
title: 创建 Webhook 并验证事件投递
intent_ref: INTENT-HOOK-001
test_type: api
setup:
  repo_fixture: ComputingActionTest/gitcode_api
  secrets: ["WEBHOOK_SECRET"]
api:
  endpoint: "/api/v5/repos/{owner}/{repo}/hooks"
  method: POST
  params: {"url": "https://example.com/webhook", "push_events": true, "merge_requests_events": true, "secret": "WEBHOOK_SECRET"}
  auth: token
  expected_status: [201]
assertions:
  - type: positive
    target: api_status_code
    status_code: 201
  - type: positive
    target: api_response_body
    json_path: "$.url"
    json_value: "https://example.com/webhook"
teardown:
  reset: fixture
