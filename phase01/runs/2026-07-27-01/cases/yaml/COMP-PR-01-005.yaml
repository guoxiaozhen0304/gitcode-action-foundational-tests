id: COMP-PR-01-005
dimensions: [completeness]
dimension: completeness
priority: P1
title: 源分支更新后 pre-merge ref 指向刷新验证
intent_ref: INTENT-COMP-033
setup:
  repo_fixture: pr-merge-ref
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    pull_request:
      branches: [main]
  jobs:
    recheck:
      name: Recheck merge ref sha
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Checkout merge ref again
          uses: checkout
          with:
            ref: refs/merge-requests/1/merge
        - name: Record head sha
          run: |
            git rev-parse HEAD
            echo "REF_SHA_RECORDED"
trigger:
  event: pull_request
  as: maintainer
  params: {}
assertions:
  - type: positive
    target: run_logs
    must_contain: REF_SHA_RECORDED
  - type: nonfunctional
    target: ref_refresh
    eval: llm_assisted
    rubric: 源分支新增提交后再次运行的 HEAD sha 应不同于首次记录值（刷新成立）；PR 合并/关闭后再次解析该 ref 的行为（报错 / 保留快照）逐字记录
  - type: negative
    target: stale_ref
    eval: llm_assisted
    rubric: 不应出现源分支已更新但 ref 解析为陈旧合并结果且无任何标识
teardown:
  reset: fixture
