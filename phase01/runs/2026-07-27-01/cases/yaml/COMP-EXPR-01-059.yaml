id: COMP-EXPR-01-059
dimensions: [completeness]
dimension: completeness
priority: P2
title: 未文档化函数 default() 的存在性与求值记录
intent_ref: INTENT-COMP-022
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  jobs:
    gated:
      name: Job gated by default fn
      if: ${{ default() }}
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Mark gated job
          run: |
            echo "DEFAULT_FN_JOB_RAN"
    witness:
      name: Witness job
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Mark witness
          run: |
            echo "WITNESS_RAN"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: positive
    target: run_logs
    must_contain: WITNESS_RAN
  - type: nonfunctional
    target: default_fn_eval
    eval: llm_assisted
    rubric: 逐字记录 default() 求值结果（校验报错 / job 执行 / job 跳过）；与 USE-039 文档面证据合并为一组双断言
  - type: negative
    target: run_logs
    eval: llm_assisted
    rubric: 未文档化函数不应被静默求值为常量导致条件恒真或恒假且无任何提示
teardown:
  reset: fixture
