id: REL-FAULT-01-038
dimensions: [reliability]
dimension: reliability
priority: P1
title: "故障注入——artifact 上传中途 runner 被杀，半成品不得作为有效 artifact 出现"
intent_ref: INTENT-REL-081
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
workflow: |
  on:
    workflow_dispatch:
  jobs:
    test:
      name: upload kill mid transfer job
      runs-on: [ubuntu-latest, x64, small]
      timeout-minutes: 30
      steps:
        - name: generate file step
          run: |
            dd if=/dev/urandom of=upload-probe.bin bs=1M count=100
        - name: upload artifact step
          uses: upload-artifact
          with:
            name: upload-kill-probe
            path: upload-probe.bin
trigger:
  event: workflow_dispatch
  as: maintainer
  params:
    rerun_after_failure: true
fault_injection:
  at: mid_job
  action: kill_runner
  params:
    during: artifact_upload
    progress_pct: 50
  recovery_expectation: "job_marked_failure_no_partial_artifact; rerun_succeeds"
assertions:
  - type: positive
    target: job_status
    equals: "failure"
  - type: negative
    target: truncated_artifact_downloadable
    equals: "true"
  - type: positive
    target: rerun_upload_md5_match
    equals: "true"
teardown:
  reset: fixture
