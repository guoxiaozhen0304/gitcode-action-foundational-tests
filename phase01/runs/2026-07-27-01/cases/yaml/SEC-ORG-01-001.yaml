id: SEC-ORG-01-001
dimensions: ["security"]
dimension: security
priority: P1
title: "可见范围外仓库的 workflow 绝不应读到组织级 secret 原值"
intent_ref: INTENT-SEC-039
setup:
  repo_fixture: org-scoped-secret
  secrets: ["ORG_SHARED_KEY"]
workflow: |
  on:
    workflow_dispatch:
  jobs:
    org-secret-scope:
      name: Reference org secret outside scope
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Echo org secret value
          run: |
            echo "ORG_SECRET_VALUE: ${{ secrets.ORG_SHARED_KEY }}"
trigger:
  event: workflow_dispatch
  as: maintainer
  params:
    repo_scope: outside_visibility
fault_injection: null
assertions:
  - type: negative
    target: run_logs
    must_not_contain_secret: "ORG_SHARED_KEY"
  - type: positive
    target: run_logs
    equals: "empty_or_error_outside_scope"
  - type: nonfunctional
    target: visibility_change
    eval: llm_assisted
    rubric: "组织级 secret 可见范围变更应即时生效（无缓存窗口）：变更后范围外仓库的 workflow 立即读不到原值；由 harness 执行变更前后对照运行，LLM 辅助核验"
teardown:
  reset: fixture
