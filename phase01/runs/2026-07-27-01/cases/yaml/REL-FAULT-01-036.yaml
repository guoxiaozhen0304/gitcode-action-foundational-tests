id: REL-FAULT-01-036
dimensions: [reliability]
dimension: reliability
priority: P1
title: "故障注入——runner 与平台心跳分区 60 秒后恢复，job 应续跑完成而非误判失败"
intent_ref: INTENT-REL-080
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
workflow: |
  on:
    workflow_dispatch:
  jobs:
    test:
      name: heartbeat partition 60s job
      runs-on: [ubuntu-latest, x64, small]
      timeout-minutes: 30
      steps:
        - name: pre partition marker step
          run: |
            echo "pre_partition_marker"
        - name: long work step
          run: |
            sleep 180
        - name: post partition marker step
          run: |
            echo "post_partition_marker"
        - name: final step
          run: |
            echo "job_completed_marker"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
fault_injection:
  at: mid_job
  action: network_partition
  params:
    scope: runner_to_platform
    duration_seconds: 60
    inject_at_step: 2
  recovery_expectation: "auto_recover_resume_and_success"
assertions:
  - type: positive
    target: job_status
    equals: "success"
  - type: positive
    target: run_logs
    contains: "post_partition_marker"
  - type: negative
    target: job_status
    equals: "failure"
  - type: nonfunctional
    target: heartbeat_death_threshold_observation
    equals: "recorded"
teardown:
  reset: fixture
