id: USE-DOC-01-002
dimensions: ["usability"]
dimension: usability
priority: P0
title: "stages 与 stages 内 jobs 字段语法跨文档四种形态互相矛盾的扫描"
intent_ref: INTENT-USE-032

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: null

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: negative
    target: documentation
    eval: "deterministic"
    criterion: "grep stages: 与 stages 内 jobs 形态；形态组合数大于 1 且文档未在任何一处说明等价关系即不合格；同页自相矛盾单独计缺陷"
  - type: nonfunctional
    target: documentation
    eval: "deterministic"
    criterion: "workflow-file-location-structure.md 应对 stages 给出单一权威形态定义；平台实际接受形态由 COMP-019 裁定，本条仅判文档一致性"

teardown:
  reset: none
