id: SEC-NAME-01-003
dimensions: ["security"]
dimension: security
priority: P1
title: "可遮蔽系统变量的 secret 命名（ATOMGIT_ 前缀/非法字符/数字开头）创建时必须被拒"
intent_ref: INTENT-SEC-041
setup:
  repo_fixture: default
workflow: null
trigger:
  event: workflow_dispatch
  as: maintainer
  params:
    invalid_names: ["ATOMGIT_TOKEN", "my-secret", "1SECRET"]
    valid_name: "DEPLOY_KEY"
fault_injection: null
# 注：本用例为平台操作型——harness 通过 secret 管理 API 逐一尝试创建 invalid_names 与
# valid_name，无 gitcode workflow，workflow 为 null 属用例设计。报错文案是否明确指出
# 命名规则属文案判读，保留 llm_assisted。
assertions:
  - type: positive
    target: secret_mgmt_api
    equals: "valid_name_created"
  - type: negative
    target: secret_mgmt_api
    must_not_equal: "invalid_name_accepted"
  - type: nonfunctional
    target: error_message
    eval: llm_assisted
    rubric: "拒绝报错应明确指出命名规则（仅大写字母/数字/下划线、不得以 ATOMGIT_ 开头、不得以数字开头）；与 INTENT-USE-028 共享证据链"
teardown:
  reset: fixture
