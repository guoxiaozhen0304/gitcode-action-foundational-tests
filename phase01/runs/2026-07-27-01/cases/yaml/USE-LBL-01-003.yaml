id: USE-LBL-01-003
dimensions: ["usability"]
dimension: usability
priority: P0
title: "runs-on 标签写法跨文档形态扫描（同一字段不应出现三种以上互斥形态）"
intent_ref: INTENT-USE-031

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: null

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: negative
    target: documentation
    eval: "deterministic"
    criterion: "对 gitcode-spec 全文 grep runs-on: 归纳形态数；形态数大于 2 且文档未在任何一处集中说明等价关系即不合格"
  - type: nonfunctional
    target: documentation
    eval: "deterministic"
    criterion: "selecting-runner-labels.md 应列出全部合法形态并标注推荐写法"

teardown:
  reset: none
