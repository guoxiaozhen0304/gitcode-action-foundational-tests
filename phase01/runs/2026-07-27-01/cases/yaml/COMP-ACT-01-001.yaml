id: COMP-ACT-01-001
dimensions: [completeness, compatibility]
dimension: completeness
priority: P2
title: action inputs.required 未传参时平台不自动校验
intent_ref: INTENT-COMP-026
setup:
  repo_fixture: local-action-required
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  jobs:
    callaction:
      name: Call local action missing required
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Call without required input
          uses: ./.gitcode/actions/req-check
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: positive
    target: run_status
    equals: success
  - type: positive
    target: run_logs
    must_contain: REQ_INPUT_EMPTY
teardown:
  reset: fixture
