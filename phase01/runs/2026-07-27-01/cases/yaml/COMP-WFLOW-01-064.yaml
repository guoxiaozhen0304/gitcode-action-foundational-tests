id: COMP-WFLOW-01-064
dimensions: [completeness]
dimension: completeness
priority: P1
title: workflow stages 阶段结构字段验证
intent_ref: INTENT-COMP-061
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  stages:
    build:
      name: Build Stage
      fail_fast: true
      jobs:
        build:
          name: Build job
          runs-on: [ubuntu-latest, x64, small]
          steps:
            - name: Build step
              run: |
                echo "build_done"
        build-fail:
          name: Build failing job
          runs-on: [ubuntu-latest, x64, small]
          steps:
            - name: Force fail
              run: |
                echo "build_fail_injected"
                exit 1
    test:
      name: Test Stage
      fail_fast: false
      jobs:
        test:
          name: Test job
          runs-on: [ubuntu-latest, x64, small]
          steps:
            - name: Test step
              run: |
                echo "test_done"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: positive
    target: run_status
    equals: failure
  - type: positive
    target: run_logs
    must_contain: build_done
  - type: negative
    target: run_logs
    must_not_contain: test_done
  - type: nonfunctional
    target: workflow_parse
    eval: llm_assisted
    rubric: "变体：缺省 stages 字段的 workflow（仅顶层 jobs）应被平台接受，等价于单 stage 执行"
teardown:
  reset: fixture
