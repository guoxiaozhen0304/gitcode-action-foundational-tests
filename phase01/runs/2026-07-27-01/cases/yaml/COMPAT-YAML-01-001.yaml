id: COMPAT-YAML-01-001
dimensions: [compatibility, usability]
dimension: compatibility
priority: P2
title: "YAML 1.1 on 键布尔陷阱与 env 中 yes/no/on/off 字面量的解析行为"
intent_ref: INTENT-COMPAT-049

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    push:
      branches: [main]
  env:
    DEBUG_FLAG: on
  jobs:
    probe:
      name: Probe on key boolean trap
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Echo env literal value
          run: |
            echo "DEBUG_FLAG=[$DEBUG_FLAG]"
            echo "ON_KEY_OK"

trigger:
  event: push
  as: maintainer
  params:
    branch: "main"

fault_injection: null

assertions:
  - type: positive
    target: run_logs
    must_contain: "ON_KEY_OK"
  - type: negative
    target: run_list
    eval: llm_assisted
    rubric: "push 后不应出现 workflow 静默不触发且无任何告警；不触发即证明 on 键被解析为布尔 true，记为解析器兼容缺陷"
  - type: positive
    target: run_logs
    eval: llm_assisted
    rubric: "DEBUG_FLAG 的取值（字符串 on 或布尔翻转后的值）与 GitHub 行为比对并记录；不一致列入解析器差异清单"

teardown:
  reset: fixture
