id: SEC-ARTF-01-003
dimensions: ["security"]
dimension: security
priority: P2
title: "宽通配打包含敏感文件名的 artifact 绝不应在无警示情况下静默成功且可被无痕下载"
intent_ref: INTENT-SEC-045
setup:
  repo_fixture: with-sensitive-files
workflow: |
  on:
    workflow_dispatch:
  jobs:
    artifact-hygiene:
      name: Wide glob artifact upload check
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Create placeholder sensitive named files
          run: |
            echo "placeholder-not-a-real-secret" > .env.fixture
            echo "placeholder-credential" > credentials.fixture
        - name: Upload workspace with wide glob
          uses: upload-artifact
          with:
            name: workspace-bundle
            path: .
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
fault_injection: null
assertions:
  - type: negative
    target: run_logs
    must_not_equal: "silent_success_no_warning"
  - type: negative
    target: artifact_download
    must_not_equal: "cross_role_download_without_trace"
  - type: nonfunctional
    target: documentation
    eval: llm_assisted
    rubric: "若平台无打包防护机制，文档必须明示敏感文件夹带风险与推荐写法"
teardown:
  reset: fixture
