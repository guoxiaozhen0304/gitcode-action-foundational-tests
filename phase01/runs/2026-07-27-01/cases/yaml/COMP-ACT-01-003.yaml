id: COMP-ACT-01-003
dimensions: [completeness, reliability]
dimension: completeness
priority: P1
title: 手动取消时 action runs.post 由调度服务调用
intent_ref: INTENT-COMP-028
setup:
  repo_fixture: local-action-post
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  jobs:
    longrun:
      name: Long running job with post action
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Run cancellable action
          uses: ./.gitcode/actions/post-hook
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {note: "job 运行至约 50% 进度时手动取消"}
assertions:
  - type: positive
    target: run_logs
    must_contain: POST_CLEANUP_DONE
  - type: negative
    target: run_status
    equals: success
  - type: nonfunctional
    target: post_latency
    eval: llm_assisted
    rubric: 记录取消到 post 被调用的时延实测值（应有上界）；post 执行失败不应改变 workflow 已取消的终态
teardown:
  reset: fixture
