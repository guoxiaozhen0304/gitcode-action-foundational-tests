id: COMPAT-RUNSON-01-005
dimensions: [compatibility, usability]
dimension: compatibility
priority: P1
title: "Runner OS 多样性探测：windows-latest 的调度结局（不支持应明确报错）"
intent_ref: INTENT-COMPAT-054

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    probe:
      name: Probe windows runner availability
      runs-on: [windows-latest, x64, small]
      steps:
        - name: Mark if scheduled on windows
          run: |
            echo "WINDOWS_RUNNER_SCHEDULED"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_status
    eval: llm_assisted
    rubric: "windows-latest 结局确定：调度成功（日志含 WINDOWS_RUNNER_SCHEDULED，证明平台提供 Windows Runner）或校验/调度期明确报错并列出受支持 OS 清单"
  - type: negative
    target: run_status
    eval: llm_assisted
    rubric: "不应表现为 job 无限 queued 且无任何提示（与 NEW-008 标签不匹配同策略）；用户必须能区分无此 OS 与资源繁忙"
  - type: nonfunctional
    target: run_status
    eval: llm_assisted
    rubric: "结论回写 parity-matrix 新增 Runner OS 多样性能力行；若仅支持 Linux，迁移指引须显式声明 Windows 构建需自托管 Runner"

teardown:
  reset: fixture
