id: COMPAT-LIMIT-01-001
dimensions: [compatibility]
dimension: compatibility
priority: P2
title: "单次推送多个 tag 的事件生成上限行为（GitHub 超过 3 个不生成事件）"
intent_ref: INTENT-COMPAT-052

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    push:
      tags:
        - "v*"
  jobs:
    probe:
      name: Probe batch tag push limit
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Mark tag triggered run
          run: |
            echo "TAG_RUN_REF=${{ atomgit.ref }}"
            echo "TAG_RUN_SHA=${{ atomgit.sha }}"

trigger:
  event: tag
  as: maintainer
  params:
    tag_count: 4
    tags: [v0.0.1-probe, v0.0.2-probe, v0.0.3-probe, v0.0.4-probe]

fault_injection: null

# 注：本用例为平台行为探针——4 个 tag 实际生成多少个 run（4/部分/0）本身是被测未知数，
# run_list 计数与"是否静默丢弃"只能事后查询运行列表判定，无法由 workflow 步骤产出确定值，
# 故保留 llm_assisted；workflow 步骤已真实标记每个被创建 run 的 ref/sha 供计数核对。
assertions:
  - type: positive
    target: run_list
    eval: llm_assisted
    rubric: "单次推送 4 个 tag 后，运行记录中含 TAG_RUN_REF=refs/tags/v0.0.X-probe 标记的 run 数量确定（4/部分/0），与 GitHub 超过 3 个不生成事件的限额比对；GitCode 限额或无限额结论文档化"
  - type: negative
    target: run_list
    eval: llm_assisted
    rubric: "若部分或全部 tag 未生成事件，不应表现为静默丢弃且无任何可查询记录或提示"

teardown:
  reset: fixture
