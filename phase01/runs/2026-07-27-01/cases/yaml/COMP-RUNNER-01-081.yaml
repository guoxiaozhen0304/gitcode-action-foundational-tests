id: COMP-RUNNER-01-081
dimensions: [completeness, compatibility]
dimension: completeness
priority: P1
title: 四段式 runs-on（codearts-hosted 首段）调度行为裁定
intent_ref: INTENT-COMP-029
setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default
fault_injection: null
workflow: |
  on:
    workflow_dispatch:
  jobs:
    probe:
      name: Probe four label runner
      runs-on: ['codearts-hosted', 'ubuntu-latest', 'x64', 'large']
      steps:
        - name: Print runner identity
          run: |
            echo "RUNNER_NAME=${{ runner.name }}"
            echo "RUNNER_OS=${{ runner.os }}"
trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}
assertions:
  - type: positive
    target: run_logs
    must_contain: RUNNER_NAME=
  - type: nonfunctional
    target: runner_identity
    eval: llm_assisted
    rubric: 逐字记录实际调度到的 Runner 与 codearts-hosted 首段语义（资源池标识合法取值集合）；与 USE-040 / COMPAT-046 证据合并，不重复探测
  - type: negative
    target: runner_mismatch
    eval: llm_assisted
    rubric: 语法被接受后不应调度到与标签声明不符的 Runner 且无任何提示
teardown:
  reset: fixture
