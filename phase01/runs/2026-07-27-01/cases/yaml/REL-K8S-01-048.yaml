id: REL-K8S-01-048
dimensions: [reliability]
dimension: reliability
priority: P1
title: "Karmada 按卡型号/数量自动分发与成员资源不足时的终态语义"
intent_ref: INTENT-REL-087
setup:
  repo_fixture: default
  secrets: []
  variables:
    member_clusters: ">=2"
    npu_models: "heterogeneous"
  branch_protection: default
workflow: null
trigger:
  event: manual
  as: maintainer
  params:
    platform_op: karmada_auto_distribution
fault_injection: null
assertions:
  - type: positive
    target: auto_distribution_placement
    eval: llm_assisted
    rubric: "自动分发应按卡型号和数量选择正确的成员集群（拥有对应型号且数量充足者），不应落到无对应型号的集群。输入退化声明：oracle 仅有 xlsx 预期结果列（能正常运行，实测未执行），分发正确性细项需结合实测环境判定"
  - type: positive
    target: insufficient_resource_task_state
    equals: "Pending_or_Failed"
  - type: negative
    target: insufficient_resource_task_state
    eval: llm_assisted
    rubric: "成员集群资源不足时不应静默悬挂：任务在 Karmada 控制面必须有明确的 Pending 或 Failed 状态，且无状态之外应有可观测事件说明"
teardown:
  reset: fixture
