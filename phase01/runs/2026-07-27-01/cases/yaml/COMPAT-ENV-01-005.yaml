id: COMPAT-ENV-01-005
dimensions: [compatibility]
dimension: compatibility
priority: P1
title: "RUNNER_* 系列环境变量在 GitCode Runner 上的注入情况探测"
intent_ref: INTENT-COMPAT-044

setup:
  repo_fixture: default
  secrets: []
  variables: {}
  branch_protection: default

workflow: |
  on:
    workflow_dispatch:
  jobs:
    probe:
      name: Probe RUNNER series env vars
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: Echo RUNNER identification vars
          run: |
            echo "RUNNER_OS=[$RUNNER_OS]"
            echo "RUNNER_ARCH=[$RUNNER_ARCH]"
            echo "RUNNER_NAME=[$RUNNER_NAME]"
        - name: Echo RUNNER path and capability vars
          run: |
            echo "RUNNER_TEMP=[$RUNNER_TEMP]"
            echo "RUNNER_TOOL_CACHE=[$RUNNER_TOOL_CACHE]"
            echo "RUNNER_ENVIRONMENT=[$RUNNER_ENVIRONMENT]"
            echo "PROBE_DONE"

trigger:
  event: workflow_dispatch
  as: maintainer
  params: {}

fault_injection: null

assertions:
  - type: positive
    target: run_logs
    must_contain: "PROBE_DONE"
  - type: positive
    target: run_logs
    eval: llm_assisted
    rubric: "逐字记录六个 RUNNER_* 变量取值；全部为空则确认为不注入并列入差异清单；部分有值部分为空属半套兼容须单独记为缺陷；给出 runner 上下文替代写法对照"
  - type: negative
    target: run_logs
    eval: llm_assisted
    rubric: "不应出现文档未声明而实测部分注入的不一致（如 RUNNER_TEMP 有值而 RUNNER_OS 为空且无说明）"

teardown:
  reset: fixture
