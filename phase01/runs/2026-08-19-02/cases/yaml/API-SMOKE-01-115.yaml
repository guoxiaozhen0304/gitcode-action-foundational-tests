id: API-SMOKE-01-115
dimensions:
- completeness
dimension: completeness
priority: P1
title: 探测 获取某个 Pull Request的所有标签 端点可用性
intent_ref: INTENT-COMP-106
test_type: api
setup:
  repo_fixture: openeuler-test/gitcode_apitest
api:
  endpoint: /api/v5/repos/{owner}/{repo}/pulls/{number}/labels
  method: GET
  auth: token
  expected_status: &id001
  - 200
  - 400
  - 401
  - 403
  - 404
assertions:
- type: positive
  target: api_status_code
  status_codes: *id001
- type: negative
  target: api_response_body
  must_not_contain: Internal Server Error
teardown:
  reset: fixture
