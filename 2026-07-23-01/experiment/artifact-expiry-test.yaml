on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: [ubuntu-latest, x64, small]
    steps:
      - name: Create artifact
        run: echo "created-at-$(date -u +%Y%m%dT%H%M%SZ)" > temp.txt

      - name: Upload artifact
        identifier: upload
        uses: upload-artifact
        with:
          name: temp-artifact
          path: temp.txt
          retention-days: 1

      - name: Show artifact uploaded
        run: echo "Artifact uploaded. Re-run download job later to test expiry."

  download:
    needs: upload
    runs-on: [ubuntu-latest, x64, small]
    steps:
      - name: Try download
        continue-on-error: true
        uses: download-artifact
        with:
          name: temp-artifact
          path: downloaded/

      - name: Check result
        run: |
          if [ -f downloaded/temp.txt ]; then
            echo "OK: artifact still valid"
            cat downloaded/temp.txt
          else
            echo "EXPIRED or not found"
          fi
